name: Finish PR 297 review fixes

on:
  push:
    branches: [ feat/multisport-running-triathlon-support ]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Merge current main and apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "app/src/engine/policy.ts" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours app/src/engine/policy.ts
          fi

          node scripts/finish-pr-297.mjs
          git add -A

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "fix(multisport): address PR review findings"
          fi

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run full app validation
        working-directory: app
        run: npm run check

      - name: Push validated fixes
        run: git push origin HEAD:feat/multisport-running-triathlon-support
