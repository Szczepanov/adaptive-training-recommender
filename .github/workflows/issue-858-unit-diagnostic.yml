name: Issue 858 review-fix handoff

on:
  push:
    branches:
      - issue-858-simulation-prescribed-duration

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: ${{ !contains(github.event.head_commit.message, 'harden prescribed-duration replay') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-858-simulation-prescribed-duration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply surgical review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace_one(
              'app/src/engine/simulation/analyze.ts',
              'export function toCompletedExposure(day: WeekAheadDay, recommendation?: Recommendation): CompletedExposure {',
              '''export function toCompletedExposure(day: WeekAheadDay): CompletedExposure;
          export function toCompletedExposure(day: WeekAheadDay, recommendation: Recommendation): CompletedExposure;
          export function toCompletedExposure(day: WeekAheadDay, recommendation?: Recommendation): CompletedExposure {''',
          )
          replace_one(
              'app/src/engine/simulation/analyze.ts',
              '        recommendation ?? simulatedRecommendationForDay(day),',
              "        (recommendation && typeof recommendation === 'object' ? recommendation : undefined) ?? simulatedRecommendationForDay(day),",
          )
          replace_one(
              'app/src/engine/forecastAuthority.test.ts',
              '        .map(day => toCompletedExposure(day))];',
              '        .map(toCompletedExposure)];',
          )
          marker = "    it('keeps the established training-age gate when 12 full Zone 2 prescriptions supply 720 minutes', () => {"
          map_regression = '''    it('remains safe when used directly as an Array.map callback', () => {
              const template = ENRICHED_TEMPLATES_BY_ID.get('end_easy_01');
              expect(template).toBeDefined();
              if (!template) throw new Error('end_easy_01 must exist for this regression fixture');

              const recommendation = {
                  template,
                  mode: 'train',
                  rationale: 'unary map callback regression fixture',
                  plannedDose: { volume: 1, intensity: 1 },
              } as Recommendation;
              const day = recommendationAsDay('2026-08-22', recommendation, 'Build');

              // Array.map passes (value, index, array). The exported helper historically had
              // unary callback semantics, so the numeric index must never be mistaken for a
              // Recommendation when the optional simulation-only override is used internally.
              const [exposure] = [day].map(toCompletedExposure);
              expect(exposure.trainingRecordLike.duration_min).toBe(60);
          });

          '''
          replace_one(
              'app/src/engine/simulation/effectiveDoseSimulation.test.ts',
              marker,
              map_regression + marker,
          )
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Verify review fixes
        working-directory: app
        run: |
          npx tsc -b
          npx vitest run src/engine/simulation/effectiveDoseSimulation.test.ts src/engine/forecastAuthority.test.ts src/engine/issue758CyclingQualityDiagnostic.test.mjs
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/engine/simulation/analyze.ts app/src/engine/simulation/effectiveDoseSimulation.test.ts app/src/engine/forecastAuthority.test.ts
          git diff --cached --check
          git commit -m "fix(simulation): harden prescribed-duration replay"
          git push origin HEAD:issue-858-simulation-prescribed-duration
