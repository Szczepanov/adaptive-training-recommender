name: Apply PR 214 review hardening

on:
  push:
    branches:
      - feature/ai-plan-judge-simulation
    paths:
      - .github/review-fixes.patch
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-plan-judge-simulation
          fetch-depth: 0

      - name: Apply review patch
        run: |
          git apply --check .github/review-fixes.patch
          git apply .github/review-fixes.patch

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate code and tests
        working-directory: app
        run: |
          npm run check
          npm run simulate:plan-judge

      - name: Commit validated fixes and remove staging files
        run: |
          rm .github/review-fixes.patch .github/workflows/apply-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden plan judge review contracts"
          git push origin HEAD:feature/ai-plan-judge-simulation

# This one-shot workflow deletes itself after the validated fix commit is pushed.
