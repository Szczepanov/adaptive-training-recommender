name: PR 200 remaining review fixes

on:
  push:
    branches:
      - feat/garmin-spo2-skin-temp

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/garmin-spo2-skin-temp
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Apply remaining reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          def append_if_missing(path: str, sentinel: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if sentinel in text:
                  return
              file.write_text(text.rstrip() + "\n\n\n" + dedent(addition).strip() + "\n")

          replace_once(
              "src/garmin_sync/mapper.py",
              dedent('''
                      heartRateZonesAvailable=canonical.heart_rate_zones is not None
                      and canonical.heart_rate_zones.max_hr_used is not None,
                      spo2Available=canonical.spo2 is not None and canonical.spo2.avg_pct is not None,
              '''),
              dedent('''
                      heartRateZonesAvailable=canonical.heart_rate_zones is not None
                      and canonical.heart_rate_zones.max_hr_used is not None,
                      spo2Available=canonical.spo2 is not None
                      and any(
                          value is not None
                          for value in (
                              canonical.spo2.avg_pct,
                              canonical.spo2.min_pct,
                              canonical.spo2.sleep_avg_pct,
                          )
                      ),
                      skinTempAvailable=canonical.skin_temp_deviation_celsius is not None,
              '''),
          )

          replace_once(
              "src/garmin_sync/models.py",
              "    spo2Available: bool = False\n\n    def to_dict(self) -> dict[str, bool]:",
              "    spo2Available: bool = False\n    skinTempAvailable: bool = False\n\n    def to_dict(self) -> dict[str, bool]:",
          )

          replace_once(
              "app/src/engine/models.ts",
              "        spo2Available?: boolean;\n    };",
              "        spo2Available?: boolean;\n        skinTempAvailable?: boolean;\n    };",
          )

          replace_once(
              "app/src/components/DataView.tsx",
              dedent('''
                        <div className="data-item">
                          <span className="data-label">SpO2 (Avg / Min):</span>
                          <span className="data-value">
                            {recoverySnapshot?.raw.spo2?.avgPct != null ? `${recoverySnapshot.raw.spo2.avgPct}%` : 'N/A'}
                            {recoverySnapshot?.raw.spo2?.minPct != null ? ` / min ${recoverySnapshot.raw.spo2.minPct}%` : ''}
                          </span>
                        </div>
              '''),
              dedent('''
                        <div className="data-item">
                          <span className="data-label">SpO2 (Daily Avg / Daily Min / Sleep Avg):</span>
                          <span className="data-value">
                            {[
                              recoverySnapshot?.raw.spo2?.avgPct != null
                                ? `daily avg ${recoverySnapshot.raw.spo2.avgPct}%`
                                : null,
                              recoverySnapshot?.raw.spo2?.minPct != null
                                ? `daily min ${recoverySnapshot.raw.spo2.minPct}%`
                                : null,
                              recoverySnapshot?.raw.spo2?.sleepAvgPct != null
                                ? `sleep avg ${recoverySnapshot.raw.spo2.sleepAvgPct}%`
                                : null,
                            ].filter(Boolean).join(' / ') || 'N/A'}
                          </span>
                        </div>
              '''),
          )

          replace_once(
              "app/src/components/DailyCheckin.tsx",
              dedent('''
                    {recoverySnapshot.raw.spo2?.avgPct != null && (
                      <div className="garmin-metric-pill">
                        <span className="pill-label">SpO2 Pulse Ox</span>
                        <span className="pill-val">{recoverySnapshot.raw.spo2.avgPct}%</span>
                        {recoverySnapshot.raw.spo2.minPct != null && <small>min {recoverySnapshot.raw.spo2.minPct}%</small>}
                      </div>
                    )}
              '''),
              dedent('''
                    {recoverySnapshot.raw.spo2 &&
                      (recoverySnapshot.raw.spo2.avgPct != null ||
                        recoverySnapshot.raw.spo2.minPct != null ||
                        recoverySnapshot.raw.spo2.sleepAvgPct != null) && (
                        <div className="garmin-metric-pill">
                          <span className="pill-label">SpO2 Pulse Ox</span>
                          <span className="pill-val">
                            {recoverySnapshot.raw.spo2.avgPct ??
                              recoverySnapshot.raw.spo2.sleepAvgPct ??
                              recoverySnapshot.raw.spo2.minPct}%
                          </span>
                          <small>
                            {[
                              recoverySnapshot.raw.spo2.avgPct != null ? 'daily avg' : null,
                              recoverySnapshot.raw.spo2.minPct != null
                                ? `daily min ${recoverySnapshot.raw.spo2.minPct}%`
                                : null,
                              recoverySnapshot.raw.spo2.sleepAvgPct != null
                                ? `sleep avg ${recoverySnapshot.raw.spo2.sleepAvgPct}%`
                                : null,
                            ].filter(Boolean).join(' · ')}
                          </small>
                        </div>
                      )}
              '''),
          )

          replace_once(
              "src/garmin_sync/service.py",
              dedent('''
                      """Archive the stats/sleep/hrv (+ fallback) payloads a fetch_daily_metrics call
                      returned, remapping the fallback keys back to their real endpoint name and D-1
                      logical date. Shared by sync_daily and backfill so they can't drift apart."""
              '''),
              dedent('''
                      """Archive daily core payloads and optional enrichments returned by the provider.

                      Fallback stats/sleep payloads are remapped to their real endpoint and D-1 logical
                      date. Enrichments such as SpO2 keep the target date. Shared by sync_daily and
                      backfill so live archival semantics cannot drift between those paths.
                      """
              '''),
          )

          append_if_missing(
              "tests/test_mapper.py",
              "def test_data_quality_tracks_partial_spo2_and_skin_temp_availability():",
              '''
              def test_data_quality_tracks_partial_spo2_and_skin_temp_availability():
                  from garmin_sync.canonical import CanonicalSpo2

                  canonical = CanonicalDailyMetrics(
                      date="2026-08-23",
                      spo2=CanonicalSpo2(sleep_avg_pct=95.0),
                      skin_temp_deviation_celsius=0.0,
                  )

                  snapshot = build_snapshot_from_canonical(
                      user_id="test_uid",
                      target_date_iso="2026-08-23",
                      canonical=canonical,
                      canonical_activities=[],
                      derived_metrics=DerivedMetrics(),
                  )

                  assert snapshot.raw.spo2 is not None
                  assert snapshot.raw.spo2.avgPct is None
                  assert snapshot.raw.spo2.sleepAvgPct == 95.0
                  assert snapshot.dataQuality.spo2Available is True
                  assert snapshot.dataQuality.skinTempAvailable is True
              ''',
          )

          replace_once(
              "docs/architecture/ingestion-pipeline.md",
              "* [`src/garmin_sync/garmin_client.py`](../../src/garmin_sync/garmin_client.py) — Low-level Garth client wrapper fetching daily stats, sleep JSON, HRV balance, body battery, and activity histories.",
              "* [`src/garmin_sync/garmin_client.py`](../../src/garmin_sync/garmin_client.py) — Low-level Garmin client wrapper fetching daily stats, sleep JSON, HRV balance, Pulse Ox / SpO2, body battery, training telemetry, and activity histories.",
          )

          replace_once(
              "docs/architecture/ingestion-pipeline.md",
              dedent('''
              The detail path is never used by lookback resync, `backfill`, or `rebuild`, and its raw
              payloads are not stored in the date-keyed archive. Rebuild writes snapshots only, leaving
              existing standalone activity telemetry untouched.

              ---
              '''),
              dedent('''
              The detail path is never used by lookback resync, `backfill`, or `rebuild`, and its raw
              payloads are not stored in the date-keyed archive. Rebuild writes snapshots only, leaving
              existing standalone activity telemetry untouched.

              ### Recovery telemetry enrichments: SpO2 and skin temperature

              SpO2 and overnight skin-temperature deviation are persisted as **observation-only**
              recovery context. This ingestion does not add either signal to recommendation, fatigue,
              optimizer, or health-anomaly policy. Favorable wearable telemetry therefore never
              overrides subjective or tissue-response safety inputs.

              * `GarminClientWrapper.get_spo2_data` fetches the date-scoped Pulse Ox summary.
                `garmin_provider.py` `extract_spo2` accepts only strict numeric percentages in `(0, 100]`
                and keeps source meanings separate: `avgPct` / `minPct` are daily Pulse Ox fields,
                while `sleepAvgPct` comes only from the selected sleep record.
              * Skin-temperature deviation comes from the selected Garmin sleep response
                (`avgSkinTempDeviationC` plus defensive aliases); there is no separate skin-temperature
                API call. A legitimate `0.0°C` deviation remains available.
              * Sleep-date fallback is atomic for overnight context. If D-1 sleep is selected,
                target-day Pulse Ox is suppressed instead of being mixed into that D-1 record; the
                persisted SpO2 may therefore contain only `sleepAvgPct` for that snapshot.
              * The raw archive stores the date-scoped `spo2` response as an optional enrichment. Offline
                rebuild reloads it and reconstructs skin temperature from archived sleep, preserving
                live-sync/rebuild parity without calling Garmin.
              * `dataQuality.spo2Available` is true when **any** persisted SpO2 field is present, including
                sleep-only fallback data. `dataQuality.skinTempAvailable` independently tracks whether a
                skin-temperature deviation was observed.
              * Missing `garminconnect.get_spo2_data` is treated as a dependency-contract failure rather
                than silently downgrading the metric to unavailable; normal Garmin/API enrichment failures
                remain best-effort and do not abort the snapshot.

              Both recovery displays label daily and sleep SpO2 explicitly. This prevents partial Garmin
              payloads from producing misleading `N/A / min ...` output and makes sleep-only fallback
              telemetry visible after the subjective check-in reveal gate.

              ---
              '''),
          )
          PY

      - name: Format and verify Python changes
        run: |
          uv run ruff format src/garmin_sync/mapper.py src/garmin_sync/models.py src/garmin_sync/service.py tests/test_mapper.py
          uv run ruff check src/garmin_sync/mapper.py src/garmin_sync/models.py src/garmin_sync/service.py tests/test_mapper.py
          uv run mypy src/garmin_sync
          uv run pytest tests/test_spo2_skin_temp_sync.py tests/test_mapper.py tests/test_rebuild_and_audit.py tests/test_garmin_client.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Verify frontend changes
        run: |
          npm --prefix app ci
          npm --prefix app run lint
          npm --prefix app run build

      - name: Commit reviewed fixes
        run: |
          if git diff --quiet; then
            echo "No review changes to commit."
            exit 0
          fi
          git config user.name "ChatGPT review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/garmin_sync/mapper.py src/garmin_sync/models.py src/garmin_sync/service.py app/src/engine/models.ts app/src/components/DataView.tsx app/src/components/DailyCheckin.tsx tests/test_mapper.py docs/architecture/ingestion-pipeline.md
          git commit -m "fix(sync): complete SpO2 availability and display semantics"
          git push origin HEAD:feat/garmin-spo2-skin-temp
