name: Harden issue 994 choice provenance

on:
  push:
    branches:
      - fix/994-append-only-choice-events

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/994-append-only-choice-events
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Harden governing-choice provenance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/src/services/sessionExecutionService.ts',
              "            if (governingChoice.deletedAt || governingChoice.payload.kind !== 'choice') {\n                throw new Error('governingChoiceEntryId must reference a live choice event in this execution.');\n            }",
              "            if (governingChoice.deletedAt\n                || governingChoice.payload.kind !== 'choice'\n                || entry.selectedOptionId !== governingChoice.payload.optionId) {\n                throw new Error('governingChoiceEntryId must reference the live choice event whose option governed this performed entry.');\n            }",
          )

          replace_once(
              'app/firestore.rules',
              "function hasValidChoiceSupersession(userId, executionId, entryId) {",
              "function hasValidGoverningChoiceReference(userId, executionId) {\n  let data = request.resource.data;\n  let target = /databases/$(database)/documents/users/$(userId)/session_executions/$(executionId)/entries/$(data.governingChoiceEntryId);\n  return data.payload.kind != 'choice'\n    && ('selectedOptionId' in data)\n    && isChoiceEntryReference(userId, executionId, data.governingChoiceEntryId)\n    && data.selectedOptionId == get(target).data.payload.optionId;\n}\n\nfunction hasValidChoiceSupersession(userId, executionId, entryId) {",
          )
          replace_once(
              'app/firestore.rules',
              "              && (!('governingChoiceEntryId' in request.resource.data)\n                || isChoiceEntryReference(userId, executionId, request.resource.data.governingChoiceEntryId))",
              "              && (!('governingChoiceEntryId' in request.resource.data)\n                || hasValidGoverningChoiceReference(userId, executionId))",
          )

          replace_once(
              'app/src/services/sessionExecutionService.choiceAppendOnly.test.ts',
              "        await service.logEntry(userId, executionId, { ...performed, governingChoiceEntryId: 'choice-1' } as never);\n        expect(diaryWrite.commitDiaryWrite).toHaveBeenCalledOnce();",
              "        await service.logEntry(userId, executionId, { ...performed, governingChoiceEntryId: 'choice-1', selectedOptionId: 'o1' } as never);\n        expect(diaryWrite.commitDiaryWrite).toHaveBeenCalledOnce();\n\n        diaryWrite.commitDiaryWrite.mockClear();\n        await expect(service.logEntry(userId, executionId, { ...performed, id: 'set-2', governingChoiceEntryId: 'choice-1', selectedOptionId: 'wrong-option' } as never))\n            .rejects.toThrow('option governed');\n        expect(diaryWrite.commitDiaryWrite).not.toHaveBeenCalled();",
          )

          replace_once(
              'app/src/emulator/sessionChoiceAppendOnlyRules.emulator.test.ts',
              "        await assertFails(setDoc(doc(db, entriesPath, 'bad-governor'), performed('bad-governor', 5, { governingChoiceEntryId: 'set-1' })));\n        await assertSucceeds(deleteDoc(ref));",
              "        await assertFails(setDoc(doc(db, entriesPath, 'bad-governor'), performed('bad-governor', 5, { governingChoiceEntryId: 'set-1' })));\n        await assertFails(setDoc(doc(db, entriesPath, 'wrong-option'), performed('wrong-option', 5, { governingChoiceEntryId: 'choice-1', selectedOptionId: 'o2' })));\n        await assertSucceeds(deleteDoc(ref));",
          )
          PY

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --fund=false

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Run focused choice tests
        working-directory: app
        run: npx vitest run src/sessions/choiceResolution.test.ts src/sessions/choiceResolution.supersession.test.ts src/sessions/choiceEntryValidation.test.ts src/services/sessionExecutionService.choiceAppendOnly.test.ts src/components/session/SessionEntryActions.test.tsx

      - name: Run focused Firestore rules test
        working-directory: app
        run: npm run emulators:exec:rules -- "npx vitest run src/emulator/sessionChoiceAppendOnlyRules.emulator.test.ts --fileParallelism=false --maxWorkers=1"

      - name: Commit validated hardening
        shell: bash
        run: |
          rm .github/workflows/issue-994-hardening.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sessions): bind performed entries to governing choice"
          git push origin HEAD:fix/994-append-only-choice-events
