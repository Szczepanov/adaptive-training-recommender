name: Deploy Garmin Sync

# Deploys both sides of Garmin integration from one image:
#   1. garmin-account-link: HTTPS service used by the app to establish per-user Garmin tokens.
#   2. Three token-only Cloud Run Jobs that discover active links in Firestore at runtime.
# No Garmin usernames/passwords and no static APP_USER_IDS list are GitHub secrets for those
# three multi-tenant Jobs. The optional fourth Job, eight-sleep-direct-sync (ES9), is a
# deliberate exception: EIGHT_SLEEP_EMAIL/PASSWORD already only ever authenticate one single
# Eight Sleep account (there is no self-service linking flow for it, unlike Garmin/Google
# Health), so persisting its observations needs exactly one fixed APP_USER_ID -- not a
# discovered list -- and that secret is scoped to this one Job only.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "GCP region"
        required: true
        default: "europe-central2"
      run_smoke_test:
        description: "Execute the garmin-sync Job once and wait, after deploying"
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      region:
        description: "GCP region"
        type: string
        required: false
        default: "europe-central2"
      run_smoke_test:
        description: "Execute the garmin-sync Job once and wait, after deploying"
        type: boolean
        required: false
        default: false
      production_release_lock:
        description: >-
          Internal: set to true only by deploy-production.yml's call. Opts this call out of
          the shared production-wide concurrency group below, since that caller already holds
          it for the whole release -- requesting it again here would queue this job behind the
          very run it's part of and deadlock. workflow_dispatch has no such input (there is
          nothing above under `on.workflow_dispatch.inputs` to set it), so a standalone run
          always falls through to the production-wide lock.
        type: boolean
        required: false
        default: false
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_DEPLOYER_SA_EMAIL:
        required: true
      GOOGLE_HEALTH_CLIENT_ID:
        required: false
      GOOGLE_HEALTH_CLIENT_SECRET:
        required: false
      EIGHT_SLEEP_EMAIL:
        required: false
      EIGHT_SLEEP_PASSWORD:
        required: false
      EIGHT_SLEEP_CLIENT_ID:
        required: false
      EIGHT_SLEEP_CLIENT_SECRET:
        required: false
      APP_USER_ID:
        required: false

permissions:
  contents: read
  id-token: write

# Serialise both standalone deploys and calls from the end-to-end production release. A
# second image/scheduler rollout must never overtake an in-flight rollout of another SHA.
#
# A standalone workflow_dispatch run (production_release_lock defaults to false -- that input
# doesn't exist under workflow_dispatch) joins the SAME group deploy-production.yml holds for
# a whole release, so it queues behind an in-flight end-to-end release instead of deploying a
# different SHA mid-release. deploy-production.yml's own call sets production_release_lock:
# true and gets this workflow's isolated group instead: that caller already holds the
# production-wide group for the run's whole duration, so requesting it again here would queue
# this job behind the very run it's part of and deadlock. (github.event_name is NOT a usable
# signal for this: inside a called reusable workflow it still reads as the caller's own
# triggering event, e.g. workflow_dispatch, not "workflow_call" -- using it here previously
# produced the exact deadlock this comment warns about.)
concurrency:
  group: >-
    ${{ inputs.production_release_lock
      && format('deploy-garmin-sync-{0}', github.repository)
      || format('deploy-production-{0}', github.repository) }}
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ inputs.region }}
  JOB_SA_EMAIL: garmin-sync-job@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  SCHEDULER_SA_EMAIL: garmin-scheduler-invoker@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  TOKEN_BUCKET: ${{ secrets.GCP_PROJECT_ID }}-garmin-tokens
  IMAGE_TAG: ${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/garmin-sync/garmin-sync:${{ github.sha }}
  # Google Health scopes are Restricted -- CASA/Restricted Scope verification is NOT done
  # (see docs/plans/2026-08-27-real-google-health-ingestion.md). This deploy step is safe to
  # run regardless (it just stands the linking service up), but every user who links through
  # it will see Google's "unverified app" warning until verification completes.
  GOOGLE_HEALTH_REDIRECT_URI: https://${{ secrets.GCP_PROJECT_ID }}.web.app/api/google-health/callback
  APP_BASE_URL: https://${{ secrets.GCP_PROJECT_ID }}.web.app
  # `secrets` is not a valid context in a step-level `if:` (actionlint-confirmed, and per
  # GitHub's own context-availability docs) -- resolve the gate once here, at the only level
  # where `secrets` is usable outside a step body, and reference `env.*` in the step `if:`s.
  GOOGLE_HEALTH_LINKING_ENABLED: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID != '' && secrets.GOOGLE_HEALTH_CLIENT_SECRET != '' }}
  # ES9 (docs/plans/eight-sleep-direct-recovery-ingestion.md): the direct Eight Sleep
  # connector stays default-off in code (EIGHT_SLEEP_DIRECT_ENABLED) regardless of this --
  # this only gates whether eight-sleep-direct-sync gets deployed at all, and its daily
  # Cloud Scheduler job created. APP_USER_ID is required too: unlike the three multi-tenant
  # Jobs above, this one persists to exactly one fixed user (see the top-of-file comment).
  EIGHT_SLEEP_DIRECT_CONFIGURED: ${{ secrets.EIGHT_SLEEP_EMAIL != '' && secrets.EIGHT_SLEEP_PASSWORD != '' && secrets.EIGHT_SLEEP_CLIENT_ID != '' && secrets.EIGHT_SLEEP_CLIENT_SECRET != '' && secrets.APP_USER_ID != '' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Disable interactive gcloud prompts
        run: gcloud config set core/disable_prompts true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        run: |
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

      - name: Render runtime env vars
        run: |
          cat > cloud-run-garmin.env.yaml <<EOF
          APP_TIMEZONE: "Europe/Warsaw"
          GARMIN_TOKEN_STORE: "gcs"
          GARMIN_TOKEN_BUCKET: "${TOKEN_BUCKET}"
          GARMIN_ALLOW_CREDENTIAL_LOGIN: "false"
          GARMIN_ACTIVITY_DETAIL_ENABLED: "true"
          GCP_PROJECT_ID: "${GCP_PROJECT}"
          EOF

      - name: Deploy self-service Garmin account linker
        run: |
          # Garmin's interactive MFA continuation requires the same in-memory client/session.
          # max-instances=1 intentionally preserves that invariant without persisting a password
          # or SSO session. If the instance restarts, the short-lived challenge simply expires
          # and the user restarts login.
          gcloud run deploy garmin-account-link \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --command=python --args=-m,garmin_sync.account_link_api \
            --port=8080 --timeout=300 --concurrency=10 \
            --min-instances=0 --max-instances=1 \
            --allow-unauthenticated

      - name: Deploy Google Health account linker
        if: env.GOOGLE_HEALTH_LINKING_ENABLED == 'true'
        env:
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
        run: |
          # Deliberately a SEPARATE service from garmin-account-link, with normal
          # max-instances (no MFA-style in-memory session to pin to one instance) -- see
          # docs/plans/2026-08-27-real-google-health-ingestion.md's plan for why. The token
          # bucket is shared with Garmin's (google-health/ prefix keeps objects separated;
          # google_health_account_link.py never writes into Garmin's garmin/ prefix).
          cat > cloud-run-google-health.env.yaml <<EOF
          GOOGLE_HEALTH_CLIENT_ID: "${GOOGLE_HEALTH_CLIENT_ID}"
          GOOGLE_HEALTH_CLIENT_SECRET: "${GOOGLE_HEALTH_CLIENT_SECRET}"
          GOOGLE_HEALTH_REDIRECT_URI: "${GOOGLE_HEALTH_REDIRECT_URI}"
          GOOGLE_HEALTH_TOKEN_BUCKET: "${TOKEN_BUCKET}"
          APP_BASE_URL: "${APP_BASE_URL}"
          GCP_PROJECT_ID: "${GCP_PROJECT}"
          EOF
          gcloud run deploy google-health-account-link \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-google-health.env.yaml \
            --command=python --args=-m,garmin_sync.google_health_account_link_api \
            --port=8080 --timeout=300 --concurrency=80 \
            --min-instances=0 --max-instances=10 \
            --allow-unauthenticated

      - name: Smoke test google-health-account-link service health
        if: env.GOOGLE_HEALTH_LINKING_ENABLED == 'true'
        run: |
          SERVICE_URL="$(gcloud run services describe google-health-account-link \
            --region="${REGION}" --format='value(status.url)')"
          if [ -z "${SERVICE_URL}" ]; then
            echo "Cloud Run did not return a URL for google-health-account-link." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${SERVICE_URL}/health"

      - name: Deploy token-only Cloud Run Jobs
        run: |
          gcloud run jobs deploy garmin-sync \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=sync-all --max-retries=0

          gcloud run jobs deploy garmin-push-pending-workouts \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=push-pending-workouts-all --max-retries=0

          gcloud run jobs deploy garmin-manual-sync \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=poll-manual-sync-all --max-retries=0

      - name: Deploy direct Eight Sleep sync Job (ES9, daily-scheduled backfill)
        if: env.EIGHT_SLEEP_DIRECT_CONFIGURED == 'true'
        env:
          EIGHT_SLEEP_EMAIL: ${{ secrets.EIGHT_SLEEP_EMAIL }}
          EIGHT_SLEEP_PASSWORD: ${{ secrets.EIGHT_SLEEP_PASSWORD }}
          EIGHT_SLEEP_CLIENT_ID: ${{ secrets.EIGHT_SLEEP_CLIENT_ID }}
          EIGHT_SLEEP_CLIENT_SECRET: ${{ secrets.EIGHT_SLEEP_CLIENT_SECRET }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
        run: |
          # Persistence only -- this Job still never flips production recommendation
          # behavior; it only writes to the shadow health_observation_days collection (ES is
          # still default-off/non-authoritative, docs/plans/eight-sleep-direct-recovery-ingestion.md).
          # Default --args is a bounded 7-day trailing window sized for a DAILY scheduled
          # run (see the eight-sleep-direct-sync-daily Scheduler job below) -- not the
          # 56-day historical-backfill default, to keep each tick's Eight Sleep API call
          # count small (~7 calls/day) rather than repeating a full historical fetch every
          # day. Override --args at execution time for a one-off larger backfill or for the
          # comparator, e.g.:
          #   gcloud run jobs execute eight-sleep-direct-sync --region="${REGION}" \
          #     --args=backfill-eight-sleep-direct,--days=60 --wait
          #   gcloud run jobs execute eight-sleep-direct-sync --region="${REGION}" \
          #     --args=compare-eight-sleep-transports,--days=60 --wait
          cat > cloud-run-eight-sleep.env.yaml <<EOF
          APP_TIMEZONE: "Europe/Warsaw"
          GARMIN_TOKEN_STORE: "gcs"
          GARMIN_TOKEN_BUCKET: "${TOKEN_BUCKET}"
          GCP_PROJECT_ID: "${GCP_PROJECT}"
          APP_USER_ID: "${APP_USER_ID}"
          EIGHT_SLEEP_DIRECT_ENABLED: "true"
          EIGHT_SLEEP_EMAIL: "${EIGHT_SLEEP_EMAIL}"
          EIGHT_SLEEP_PASSWORD: "${EIGHT_SLEEP_PASSWORD}"
          EIGHT_SLEEP_CLIENT_ID: "${EIGHT_SLEEP_CLIENT_ID}"
          EIGHT_SLEEP_CLIENT_SECRET: "${EIGHT_SLEEP_CLIENT_SECRET}"
          EOF
          gcloud run jobs deploy eight-sleep-direct-sync \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-eight-sleep.env.yaml \
            --args=backfill-eight-sleep-direct,--days=7 --max-retries=0

      - name: Grant Cloud Scheduler permission to run the Jobs
        run: |
          gcloud run jobs add-iam-policy-binding garmin-sync \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

          gcloud run jobs add-iam-policy-binding garmin-push-pending-workouts \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

          gcloud run jobs add-iam-policy-binding garmin-manual-sync \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

      - name: Grant Cloud Scheduler permission to run the Eight Sleep Job
        if: env.EIGHT_SLEEP_DIRECT_CONFIGURED == 'true'
        run: |
          gcloud run jobs add-iam-policy-binding eight-sleep-direct-sync \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

      - name: Create/update Cloud Scheduler jobs
        run: |
          gcloud scheduler jobs update http garmin-sync-morning-poll --location="${REGION}" \
            --schedule="*/15 5-9 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-sync-morning-poll --location="${REGION}" \
            --schedule="*/15 5-9 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

          gcloud scheduler jobs update http garmin-push-pending-workouts-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-push-pending-workouts:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-push-pending-workouts-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-push-pending-workouts:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

          gcloud scheduler jobs update http garmin-manual-sync-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-manual-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-manual-sync-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-manual-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

      - name: Create/update the Eight Sleep daily Scheduler job
        if: env.EIGHT_SLEEP_DIRECT_CONFIGURED == 'true'
        run: |
          # Once daily, not a polling window like garmin-sync-morning-poll -- there is no
          # cheap Firestore freshness pre-check here (unlike sync_daily's is_fresh gate), so
          # every tick is a real Eight Sleep API call; a 15-min window would mean ~4x/hour of
          # real calls for no benefit, since last night's trends don't change intraday. 8am
          # Warsaw gives the night's data time to settle in Eight Sleep's own pipeline before
          # the Job's bounded 7-day trailing window (deploy step above) picks it up.
          gcloud scheduler jobs update http eight-sleep-direct-sync-daily --location="${REGION}" \
            --schedule="0 8 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/eight-sleep-direct-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http eight-sleep-direct-sync-daily --location="${REGION}" \
            --schedule="0 8 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/eight-sleep-direct-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

      # This is credential-free and safe on every deploy. It catches a container that pushed
      # successfully but cannot actually start under the Cloud Run runtime configuration.
      - name: Smoke test account-link service health
        run: |
          SERVICE_URL="$(gcloud run services describe garmin-account-link \
            --region="${REGION}" --format='value(status.url)')"
          if [ -z "${SERVICE_URL}" ]; then
            echo "Cloud Run did not return a URL for garmin-account-link." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${SERVICE_URL}/health"

      - name: Smoke test garmin-sync
        if: inputs.run_smoke_test
        run: gcloud run jobs execute garmin-sync --region="${REGION}" --wait
