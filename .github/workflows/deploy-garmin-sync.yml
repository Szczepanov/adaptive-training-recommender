name: Deploy Garmin Sync

# Deploys both sides of Garmin integration from one image:
#   1. garmin-account-link: HTTPS service used by the app to establish per-user Garmin tokens.
#   2. Three token-only Cloud Run Jobs that discover active links in Firestore at runtime.
# No Garmin usernames/passwords and no static APP_USER_IDS list are GitHub secrets.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "GCP region"
        required: true
        default: "europe-central2"
      run_smoke_test:
        description: "Execute the garmin-sync Job once and wait, after deploying"
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      region:
        description: "GCP region"
        type: string
        required: false
        default: "europe-central2"
      run_smoke_test:
        description: "Execute the garmin-sync Job once and wait, after deploying"
        type: boolean
        required: false
        default: false
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_DEPLOYER_SA_EMAIL:
        required: true

permissions:
  contents: read
  id-token: write

# Serialise both standalone deploys and calls from the end-to-end production release. A
# second image/scheduler rollout must never overtake an in-flight rollout of another SHA.
#
# A standalone workflow_dispatch run joins the SAME group deploy-production.yml holds for a
# whole release, so it queues behind an in-flight end-to-end release instead of deploying a
# different SHA mid-release. A workflow_call invocation (i.e. from deploy-production.yml
# itself) uses this workflow's own isolated group instead: that caller already holds the
# production-wide group for the run's whole duration, so requesting it again here would queue
# this job behind the very run it's part of and deadlock.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_call'
      && format('deploy-garmin-sync-{0}', github.repository)
      || format('deploy-production-{0}', github.repository) }}
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ inputs.region }}
  JOB_SA_EMAIL: garmin-sync-job@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  SCHEDULER_SA_EMAIL: garmin-scheduler-invoker@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  TOKEN_BUCKET: ${{ secrets.GCP_PROJECT_ID }}-garmin-tokens
  IMAGE_TAG: ${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/garmin-sync/garmin-sync:${{ github.sha }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Disable interactive gcloud prompts
        run: gcloud config set core/disable_prompts true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container image
        run: |
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

      - name: Render runtime env vars
        run: |
          cat > cloud-run-garmin.env.yaml <<EOF
          APP_TIMEZONE: "Europe/Warsaw"
          GARMIN_TOKEN_STORE: "gcs"
          GARMIN_TOKEN_BUCKET: "${TOKEN_BUCKET}"
          GARMIN_ALLOW_CREDENTIAL_LOGIN: "false"
          GARMIN_ACTIVITY_DETAIL_ENABLED: "false"
          GCP_PROJECT_ID: "${GCP_PROJECT}"
          EOF

      - name: Deploy self-service Garmin account linker
        run: |
          # Garmin's interactive MFA continuation requires the same in-memory client/session.
          # max-instances=1 intentionally preserves that invariant without persisting a password
          # or SSO session. If the instance restarts, the short-lived challenge simply expires
          # and the user restarts login.
          gcloud run deploy garmin-account-link \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --command=python --args=-m,garmin_sync.account_link_api \
            --port=8080 --timeout=300 --concurrency=10 \
            --min-instances=0 --max-instances=1 \
            --allow-unauthenticated

      - name: Deploy token-only Cloud Run Jobs
        run: |
          gcloud run jobs deploy garmin-sync \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=sync-all --max-retries=0

          gcloud run jobs deploy garmin-push-pending-workouts \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=push-pending-workouts-all --max-retries=0

          gcloud run jobs deploy garmin-manual-sync \
            --image="${IMAGE_TAG}" --region="${REGION}" \
            --service-account="${JOB_SA_EMAIL}" \
            --env-vars-file=cloud-run-garmin.env.yaml \
            --args=poll-manual-sync-all --max-retries=0

      - name: Grant Cloud Scheduler permission to run the Jobs
        run: |
          gcloud run jobs add-iam-policy-binding garmin-sync \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

          gcloud run jobs add-iam-policy-binding garmin-push-pending-workouts \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

          gcloud run jobs add-iam-policy-binding garmin-manual-sync \
            --region="${REGION}" --member="serviceAccount:${SCHEDULER_SA_EMAIL}" \
            --role="roles/run.invoker" >/dev/null

      - name: Create/update Cloud Scheduler jobs
        run: |
          gcloud scheduler jobs update http garmin-sync-morning-poll --location="${REGION}" \
            --schedule="*/15 5-9 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-sync-morning-poll --location="${REGION}" \
            --schedule="*/15 5-9 * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

          gcloud scheduler jobs update http garmin-push-pending-workouts-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-push-pending-workouts:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-push-pending-workouts-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-push-pending-workouts:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

          gcloud scheduler jobs update http garmin-manual-sync-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-manual-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}" \
          || gcloud scheduler jobs create http garmin-manual-sync-poll --location="${REGION}" \
            --schedule="*/3 * * * *" --time-zone="Europe/Warsaw" \
            --uri="https://run.googleapis.com/v2/projects/${GCP_PROJECT}/locations/${REGION}/jobs/garmin-manual-sync:run" \
            --http-method=POST --oauth-service-account-email="${SCHEDULER_SA_EMAIL}"

      # This is credential-free and safe on every deploy. It catches a container that pushed
      # successfully but cannot actually start under the Cloud Run runtime configuration.
      - name: Smoke test account-link service health
        run: |
          SERVICE_URL="$(gcloud run services describe garmin-account-link \
            --region="${REGION}" --format='value(status.url)')"
          if [ -z "${SERVICE_URL}" ]; then
            echo "Cloud Run did not return a URL for garmin-account-link." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${SERVICE_URL}/health"

      - name: Smoke test garmin-sync
        if: inputs.run_smoke_test
        run: gcloud run jobs execute garmin-sync --region="${REGION}" --wait
