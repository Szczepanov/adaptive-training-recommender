name: One-shot lineage hardening

on:
  push:
    branches:
      - feat/skr1-persisted-knowledge-lineage

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skr1-persisted-knowledge-lineage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply guarded lineage fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1. External-plan early return must carry the same applicable intent lineage.
          rules_ts = Path('app/src/engine/rules.ts')
          text = rules_ts.read_text()
          marker = 'function adjudicatedExternalRecommendation('
          start = text.index(marker)
          end = text.index('\n}\n', start) + 3
          chunk = text[start:end]
          old = '        knowledgeRefs: envelopeState.knowledgeRefs,'
          new = '''        knowledgeRefs: mergeKnowledgeRefs(\n            envelopeState.knowledgeRefs,\n            trainingIntentKnowledgeRefs(intent),\n        ),'''
          if chunk.count(old) != 1:
              raise SystemExit('Expected exactly one external-plan knowledgeRefs assignment')
          text = text[:start] + chunk.replace(old, new, 1) + text[end:]
          rules_ts.write_text(text)

          # 2. Firestore is a persistence boundary: validate every bounded ref and unique claim IDs.
          firestore = Path('app/firestore.rules')
          text = firestore.read_text()
          marker = '    function hasValidKnowledgeLineageFields(audit, version) {'
          start = text.index(marker)
          brace = text.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(text)):
              if text[i] == '{':
                  depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Could not locate knowledge-lineage rules helper end')

          groups = []
          for group in range(8):
              checks = []
              for index in range(group * 8, group * 8 + 8):
                  checks.append(f'        && (lineage.size() <= {index} || isValidKnowledgeLineageRef(lineage[{index}]))')
              groups.append(
                  f'    function hasValidKnowledgeLineageEntries{group}(lineage) {{\n'
                  f'      return true\n' + '\n'.join(checks) + ';\n'
                  f'    }}\n'
              )

          projected = []
          for index in range(64):
              projected.append(
                  f"        lineage.size() > {index} ? lineage[{index}].claimId : '__knowledge_lineage_absent_{index}__'"
              )

          replacement = '''    function isValidKnowledgeLineageRef(ref) {
      return ref is map
        && ref.keys().hasOnly(['claimId', 'version'])
        && ref.keys().hasAll(['claimId', 'version'])
        && ref.claimId is string
        && ref.claimId.size() > 0
        && ref.version is int
        && ref.version >= 1;
    }

''' + '\n'.join(groups) + '''
    function hasValidKnowledgeLineageEntries(lineage) {
      return hasValidKnowledgeLineageEntries0(lineage)
        && hasValidKnowledgeLineageEntries1(lineage)
        && hasValidKnowledgeLineageEntries2(lineage)
        && hasValidKnowledgeLineageEntries3(lineage)
        && hasValidKnowledgeLineageEntries4(lineage)
        && hasValidKnowledgeLineageEntries5(lineage)
        && hasValidKnowledgeLineageEntries6(lineage)
        && hasValidKnowledgeLineageEntries7(lineage);
    }

    // Security Rules cannot map arbitrary lists. Build a bounded claim-ID projection instead:
    // real entries use claimId; absent slots use distinct sentinels. Any duplicate real claimId
    // therefore reduces the set cardinality below 64 and fails closed.
    function hasUniqueKnowledgeLineageClaimIds(lineage) {
      return [
''' + ',\n'.join(projected) + '''
      ].toSet().size() == 64;
    }

    function hasValidKnowledgeLineageFields(audit, version) {
      return version < 4
        ? (!('knowledgeLineage' in audit) && (!('knowledgeLineageCatalog' in audit) || audit.knowledgeLineageCatalog == 'sports-science-v1'))
        : (
          audit.knowledgeLineage is list
          && audit.knowledgeLineage.size() <= 64
          && hasValidKnowledgeLineageEntries(audit.knowledgeLineage)
          && hasUniqueKnowledgeLineageClaimIds(audit.knowledgeLineage)
          && audit.knowledgeLineageCatalog == 'sports-science-v1'
        );
    }'''
          text = text[:start] + replacement + text[end:]
          firestore.write_text(text)

          # 3. Record the boundary semantics in the SKR1 design record.
          doc = Path('docs/analysis/2026-08-31-skr1-persisted-knowledge-lineage.md')
          text = doc.read_text()
          heading = '## Review hardening: persistence and consumed-branch semantics'
          if heading not in text:
              text += f'''\n\n{heading}\n\n- `knowledgeLineage` records claims materially consumed by the executed decision path, not every contextual field merely present in the input. In particular, long-horizon readiness context is attributed only when the corresponding 7-day anchor causes the strain branch to read it.\n- External-plan recommendations merge applicable training-intent lineage before their early return, matching internally optimized recommendations.\n- Schema-v4 Firestore writes fail closed unless each lineage ref has exactly `claimId` (non-empty string) and `version` (positive integer), the list is at most 64 refs, and `claimId` values are unique. Application validation remains defense in depth rather than the security boundary.\n- Firestore persists compact identity/version only; statements, citations, evidence grades, and registry source metadata remain version-controlled in Git.\n'''
              doc.write_text(text)
          PY

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate TypeScript and lint
        working-directory: app
        run: |
          npm run typecheck
          npm run lint

      - name: Run focused lineage unit tests
        working-directory: app
        run: npx vitest run src/engine/knowledgeLineage.test.ts

      - name: Run Firestore rules emulator tests
        working-directory: app
        run: npm run test:rules

      - name: Build application bundle
        working-directory: app
        run: npm run build:bundle

      - name: Commit validated hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-lineage-hardening.yml
          git add app/src/engine/rules.ts app/firestore.rules docs/analysis/2026-08-31-skr1-persisted-knowledge-lineage.md
          git diff --cached --check
          git commit -m 'fix(lineage): harden persisted provenance'
          git push origin HEAD:feat/skr1-persisted-knowledge-lineage
