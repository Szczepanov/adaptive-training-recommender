name: Issue 858 reviewed baseline refresh

on:
  push:
    branches:
      - issue-858-simulation-prescribed-duration

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-858-simulation-prescribed-duration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Remove superseded harness-limit note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/engine/simulation/scenarios.ts')
          text = path.read_text()
          old = "Stage-4-ready endurance+strength cyclist who opted in to capability maintenance. Owed field work lands on the mechanical support slot (due 13 days after the prior qualifying session, never earlier) without adding training days. Harness limit: sessions are recorded at template minimum duration, so the athlete falls below the #804 established bar after about three weeks and mechanical work is then withheld in both arms."
          new = "Stage-4-ready endurance+strength cyclist who opted in to capability maintenance. Owed field work lands on the mechanical support slot (due 13 days after the prior qualifying session, never earlier) without adding training days. Simulated performed=recommended history records resolved prescription duration so training-age evidence is not artificially reduced by template range minima."
          if old not in text:
              raise SystemExit('Expected #858 harness-limit note not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Regenerate reviewed simulation baseline
        working-directory: app
        run: npm run simulate:update-baseline -- --reviewed
      - name: Commit reviewed artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/engine/simulation/scenarios.ts docs/analysis/simulation-baseline.json
          git diff --cached --exit-code && exit 0
          git commit -m "test(simulation): refresh reviewed duration baseline (#858)"
          git push origin HEAD:issue-858-simulation-prescribed-duration
