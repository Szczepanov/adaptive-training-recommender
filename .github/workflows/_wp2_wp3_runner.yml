name: Wire WP2 WP3 runner

on:
  push:
    branches:
      - feat/895-wp2-wp3-lifecycle-resume

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/895-wp2-wp3-lifecycle-resume
          fetch-depth: 0
      - name: Apply runner patch
        run: python3 .github/scripts/wp2_wp3_runner_patch.py
      - name: Remove one-shot helpers
        run: rm .github/workflows/_wp2_wp3_runner.yml .github/scripts/wp2_wp3_runner_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(sessions): resume exact pinned execution state (#895)"
          git push origin HEAD:feat/895-wp2-wp3-lifecycle-resume
