name: Deploy Firestore Indexes

# Firestore index construction is asynchronous. Keep indexes as a separate deployment unit
# from rules/Hosting so the production E2E release can wait until every composite index is
# READY before exposing a frontend that may depend on it.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      production_release_lock:
        description: >-
          Internal: set to true only by deploy-production.yml's call. Opts this call out of
          the shared production-wide concurrency group below, since that caller already holds
          it for the whole release -- requesting it again here would queue this job behind the
          very run it's part of and deadlock. workflow_dispatch has no such input, so a
          standalone run always falls through to the production-wide lock.
        type: boolean
        required: false
        default: false
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_FRONTEND_DEPLOYER_SA_EMAIL:
        required: true

permissions:
  contents: read
  id-token: write

# A standalone workflow_dispatch run (production_release_lock defaults to false -- that input
# doesn't exist under workflow_dispatch) joins the SAME group deploy-production.yml holds for
# a whole release, so it queues behind an in-flight end-to-end release instead of deploying a
# different SHA mid-release. deploy-production.yml's own call sets production_release_lock:
# true and gets this workflow's isolated group instead: that caller already holds the
# production-wide group for the run's whole duration, so requesting it again here would queue
# this job behind the very run it's part of and deadlock. (github.event_name is NOT a usable
# signal for this: inside a called reusable workflow it still reads as the caller's own
# triggering event, e.g. workflow_dispatch, not "workflow_call" -- using it here previously
# produced the exact deadlock this comment warns about.)
concurrency:
  group: >-
    ${{ inputs.production_release_lock
      && format('deploy-firestore-indexes-{0}', github.repository)
      || format('deploy-production-{0}', github.repository) }}
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy and wait for indexes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FRONTEND_DEPLOYER_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # Deliberately do not pass --force. The pipeline may add/update repository-owned indexes,
      # but it must not silently delete a production index that exists outside the file. Such a
      # cleanup remains an explicit operator action after reviewing the difference.
      - name: Deploy Firestore indexes
        run: |
          npm exec --no -- firebase deploy --only firestore:indexes \
            --project "${GCP_PROJECT}" --non-interactive

      # firebase deploy returns after index creation has been requested, not necessarily after
      # the indexes are usable. Block the client rollout until all composite indexes settle.
      - name: Wait for composite indexes to become ready
        run: |
          DEADLINE=$((SECONDS + 1200))
          while true; do
            STATES="$(gcloud firestore indexes composite list \
              --database='(default)' --format='value(state)')"

            if grep -qx 'NEEDS_REPAIR' <<<"${STATES}"; then
              echo "At least one Firestore composite index is in NEEDS_REPAIR." >&2
              gcloud firestore indexes composite list --database='(default)'
              exit 1
            fi

            if ! grep -qx 'CREATING' <<<"${STATES}"; then
              echo "All Firestore composite indexes are READY."
              break
            fi

            if (( SECONDS >= DEADLINE )); then
              echo "Timed out waiting for Firestore composite indexes to become READY." >&2
              gcloud firestore indexes composite list --database='(default)'
              exit 1
            fi

            sleep 10
          done
