name: Apply issue 994 patch v3

on:
  push:
    branches: [ fix/994-append-only-choice-events ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-994-applied]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/994-append-only-choice-events
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply validated #994 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-994-apply-v2.yml').read_text()
          opener = "          python3 <<'PY'\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<issue-994-v2-applicator>', 'exec'))

          test = Path('app/src/components/session/SessionEntryActions.test.tsx')
          test.write_text(test.read_text().replace("import React from 'react';\n", '', 1))

          hook = Path('app/src/hooks/useSessionRunner.ts')
          text = hook.read_text()
          old = """        const governingChoice = resolveEffectiveChoiceEntries(entries)\n            .filter(entry => entry.stepId === activeStep.id\n                && activeBlock?.optionSets?.some(choice => choice.id === entry.payload.choiceId && choice.appliesAtStepId === activeStep.id))\n            .at(-1);"""
          new = """        const governingChoice = resolveEffectiveChoiceEntries(entries)\n            .filter(entry => rawDefinition?.blocks.some(block => {\n                const choice = block.optionSets?.find(candidate => candidate.id === entry.payload.choiceId);\n                if (!choice) return false;\n                if (choice.appliesAtStepId === activeStep.id) return true;\n                const option = choice.options.find(candidate => candidate.id === entry.payload.optionId);\n                return option?.actions.some(action => 'targetStepId' in action && action.targetStepId === activeStep.id) ?? false;\n            }))\n            .at(-1);"""
          if text.count(old) != 1:
              raise SystemExit(f'useSessionRunner governing-choice replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_deps = "}, [execution, activeStep, activeBlock, entries, userId, closeActiveRest, diaryWriteOptions]);"
          new_deps = "}, [execution, activeStep, activeBlock, rawDefinition, entries, userId, closeActiveRest, diaryWriteOptions]);"
          if text.count(old_deps) != 1:
              raise SystemExit(f'useSessionRunner dependency replacement count={text.count(old_deps)}')
          hook.write_text(text.replace(old_deps, new_deps, 1))

          for path in [
              '.github/workflows/issue-994-apply-v3.yml',
              '.github/workflows/issue-994-apply-v2.yml',
              '.github/workflows/issue-994-apply.yml',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()
          PY

          git diff --check

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --fund=false

      - name: Typecheck and lint
        working-directory: app
        run: |
          npm run typecheck
          npm run lint

      - name: Run focused unit tests
        working-directory: app
        run: npx vitest run src/sessions/choiceResolution.supersession.test.ts src/sessions/choiceEntryValidation.test.ts src/services/sessionExecutionService.choiceAppendOnly.test.ts src/components/session/SessionEntryActions.test.tsx

      - name: Run focused Firestore rules test
        working-directory: app
        run: npm run emulators:exec:rules -- "npx vitest run src/emulator/sessionChoiceAppendOnlyRules.emulator.test.ts --fileParallelism=false --maxWorkers=1"

      - name: Commit and push validated patch
        shell: bash
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sessions): enforce append-only choice events (#994) [issue-994-applied]"
          git push origin HEAD:fix/994-append-only-choice-events
