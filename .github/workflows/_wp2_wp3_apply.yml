name: Apply WP2 WP3 core patch

on:
  push:
    branches:
      - feat/895-wp2-wp3-lifecycle-resume

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/895-wp2-wp3-lifecycle-resume
          fetch-depth: 0
      - name: Apply core lifecycle and snapshot wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # models.ts: self-contained prescription snapshot + durable completion evidence.
          replace_once(
              'app/src/sessions/models.ts',
              "}\n\nexport type OccurrenceAuthority =",
              "}\n\nexport type SessionDefinitionSnapshot = Pick<SessionDefinition,\n    | 'schemaVersion'\n    | 'title'\n    | 'summary'\n    | 'intent'\n    | 'modalities'\n    | 'dominantModality'\n    | 'duration'\n    | 'sessionTargets'\n    | 'prohibitedAdditions'\n    | 'importWarnings'\n    | 'movementComposition'\n    | 'blocks'\n>;\n\nexport type OccurrenceAuthority =",
          )
          replace_once(
              'app/src/sessions/models.ts',
              "    blocks: SessionBlock[];\n    displayMetadata?: SessionDisplayMetadata;\n    createdAt: string;",
              "    blocks: SessionBlock[];\n    displayMetadata?: SessionDisplayMetadata;\n    /** Self-contained hash-covered executable bytes for exact replay. Legacy v1 rows may omit it. */\n    definitionSnapshot?: SessionDefinitionSnapshot;\n    createdAt: string;",
          )
          replace_once(
              'app/src/sessions/models.ts',
              "export interface SessionExecution {\n",
              "export interface SessionCompletionEvidence {\n    submittedAt: string;\n    sessionRpe?: number;\n    completedFraction?: number;\n    unexpectedFatigue?: boolean;\n    note?: string;\n}\n\nexport interface SessionExecution {\n",
          )
          replace_once(
              'app/src/sessions/models.ts',
              "    notes?: string;\n    schemaVersion: number;",
              "    notes?: string;\n    /** Canonical athlete-submitted completion evidence, committed with the terminal winner. */\n    completionEvidence?: SessionCompletionEvidence;\n    schemaVersion: number;",
          )

          # Hashing: optional snapshot is covered for new rows while legacy hashes stay byte-compatible.
          replace_once(
              'app/src/sessions/sessionDefinitionHash.ts',
              "['schemaVersion', 'sessionSource', 'definitionHash', 'blocks', 'displayMetadata']",
              "['schemaVersion', 'sessionSource', 'definitionHash', 'blocks', 'displayMetadata', 'definitionSnapshot']",
          )

          # Prescription reader validates an optional snapshot structurally.
          replace_once(
              'app/src/services/executionPrescriptionService.ts',
              "import type { ExecutionPrescription } from '../sessions/models';",
              "import type { ExecutionPrescription, SessionDefinitionSnapshot, SessionSourceRef } from '../sessions/models';\nimport { definitionFromSnapshot } from '../sessions/sessionDefinitionSnapshot';\nimport { validateSessionDefinition } from '../sessions/validation';",
          )
          replace_once(
              'app/src/services/executionPrescriptionService.ts',
              "function hasValidMovementComposition(value: unknown): boolean {",
              "function hasValidDefinitionSnapshot(value: unknown, source: unknown): boolean {\n    if (value === undefined) return true;\n    if (!value || typeof value !== 'object' || !hasSessionSource(source)) return false;\n    try {\n        return validateSessionDefinition(definitionFromSnapshot(\n            value as SessionDefinitionSnapshot,\n            source as SessionSourceRef,\n        )).ok;\n    } catch {\n        return false;\n    }\n}\n\nfunction hasValidMovementComposition(value: unknown): boolean {",
          )
          replace_once(
              'app/src/services/executionPrescriptionService.ts',
              "                Array.isArray(data.blocks) &&\n                hasValidDisplayMetadata(data.displayMetadata)",
              "                Array.isArray(data.blocks) &&\n                hasValidDisplayMetadata(data.displayMetadata) &&\n                hasValidDefinitionSnapshot(data.definitionSnapshot, data.sessionSource)",
          )

          # Catalog prescriptions become self-contained.
          replace_once(
              'app/src/sessions/catalogSessionAdapter.ts',
              "import { hashExecutionPrescription } from './sessionDefinitionHash';",
              "import { hashExecutionPrescription } from './sessionDefinitionHash';\nimport { snapshotSessionDefinition } from './sessionDefinitionSnapshot';",
          )
          replace_once(
              'app/src/sessions/catalogSessionAdapter.ts',
              "        displayMetadata: {\n            title: sessionDef.title,",
              "        definitionSnapshot: snapshotSessionDefinition(sessionDef),\n        displayMetadata: {\n            title: sessionDef.title,",
          )

          # Every newly-authored prescription, including fixtures, gets a pinned snapshot.
          replace_once(
              'app/src/services/sessionAuthoringService.ts',
              "import { hashExecutionPrescription, hashSessionDefinition } from '../sessions/sessionDefinitionHash';",
              "import { hashExecutionPrescription, hashSessionDefinition } from '../sessions/sessionDefinitionHash';\nimport { snapshotSessionDefinition } from '../sessions/sessionDefinitionSnapshot';",
          )
          replace_once(
              'app/src/services/sessionAuthoringService.ts',
              "/**\n * Creates the evidence records required before a manually-owned definition may execute.",
              "export async function prepareFixtureSessionLaunch(\n    userId: string,\n    definition: SessionDefinition,\n    now = new Date().toISOString(),\n): Promise<PreparedSessionLaunch> {\n    const validation = validateSessionDefinition(definition);\n    if (!validation.ok) {\n        throw new Error(validation.issues.map(issue => `${issue.path}: ${issue.message}`).join('\\n'));\n    }\n    const sessionSource = { kind: 'unplanned_fixture' as const, fixtureId: definition.id };\n    const definitionHash = await hashSessionDefinition(definition);\n    const unsignedPrescription: ExecutionPrescription = {\n        schemaVersion: 1,\n        prescriptionHash: '',\n        sessionSource,\n        definitionHash,\n        blocks: definition.blocks,\n        displayMetadata: displayMetadataFor(definition),\n        definitionSnapshot: snapshotSessionDefinition(definition),\n        createdAt: now,\n    };\n    const prescriptionHash = await hashExecutionPrescription(unsignedPrescription);\n    await executionPrescriptionService.savePrescription(userId, { ...unsignedPrescription, prescriptionHash });\n    return { definition, binding: { sessionSource, prescriptionHash } };\n}\n\n/**\n * Creates the evidence records required before a manually-owned definition may execute.",
          )
          # Three non-catalog authoring paths have the same blocks/display ordering.
          p = Path('app/src/services/sessionAuthoringService.ts')
          text = p.read_text()
          needle = "        blocks: definition.blocks,\n        displayMetadata: displayMetadataFor(definition),"
          if text.count(needle) != 2:
              raise SystemExit(f'sessionAuthoringService.ts: expected 2 simple prescription sites, got {text.count(needle)}')
          text = text.replace(needle, "        blocks: definition.blocks,\n        displayMetadata: displayMetadataFor(definition),\n        definitionSnapshot: snapshotSessionDefinition(definition),")
          p.write_text(text)
          replace_once(
              'app/src/services/sessionAuthoringService.ts',
              "        displayMetadata: {\n            title: definition.title,\n            ...(effectiveSummary !== undefined ? { summary: effectiveSummary } : {}),",
              "        definitionSnapshot: snapshotSessionDefinition(definition),\n        displayMetadata: {\n            title: definition.title,\n            ...(effectiveSummary !== undefined ? { summary: effectiveSummary } : {}),",
          )

          # Resolver: pinned self-contained snapshots are authoritative before any live source lookup.
          replace_once(
              'app/src/sessions/sessionDefinitionResolver.ts',
              "import { validateSessionDefinition } from './validation';",
              "import { validateSessionDefinition } from './validation';\nimport { definitionFromSnapshot } from './sessionDefinitionSnapshot';",
          )
          replace_once(
              'app/src/sessions/sessionDefinitionResolver.ts',
              "): Promise<DataState<SessionDefinition>> {\n    if (source.kind === 'unplanned_fixture') {",
              "): Promise<DataState<SessionDefinition>> {\n    if (prescriptionHash) {\n        const pinned = await executionPrescriptionService.getPrescription(userId, prescriptionHash);\n        if (pinned.status !== 'AVAILABLE') return pinned;\n        const documentPath = `users/${userId}/execution_prescriptions/${prescriptionHash}`;\n        if (JSON.stringify(canonicalizeSessionData(pinned.data.sessionSource)) !== JSON.stringify(canonicalizeSessionData(source))) {\n            return { status: 'INVALID', issues: [{ code: 'prescription-source-mismatch', field: 'sessionSource', documentPath }] };\n        }\n        if (pinned.data.definitionSnapshot) {\n            const reconstructed = definitionFromSnapshot(pinned.data.definitionSnapshot, source);\n            if (await hashSessionDefinition(reconstructed) !== pinned.data.definitionHash) {\n                return { status: 'INVALID', issues: [{ code: 'prescription-definition-hash-mismatch', field: 'definitionHash', documentPath }] };\n            }\n            const validation = validateSessionDefinition(reconstructed);\n            if (!validation.ok) {\n                const first = validation.issues[0];\n                return {\n                    status: 'INVALID',\n                    issues: [{\n                        code: 'invalid-prescription-session-definition',\n                        documentPath,\n                        ...(first?.path ? { field: first.path } : {}),\n                        ...(first?.message ? { message: first.message } : {}),\n                    }],\n                };\n            }\n            return { status: 'AVAILABLE', data: validation.value, revision: prescriptionHash };\n        }\n    }\n\n    if (source.kind === 'unplanned_fixture') {",
          )

          # Execution service: authoritative terminal outcome + resume diary overlay + same-day recovery lookup.
          replace_once(
              'app/src/services/sessionExecutionService.ts',
              "    FitWorkoutFingerprintKind,\n} from '../sessions/models';",
              "    FitWorkoutFingerprintKind,\n    SessionCompletionEvidence,\n} from '../sessions/models';",
          )
          replace_once(
              'app/src/services/sessionExecutionService.ts',
              "import { canonicalizeJson } from '../utils/canonicalJson';",
              "import { canonicalizeJson } from '../utils/canonicalJson';\nimport { overlayQueuedDiaryState } from '../sessions/sessionDiaryResume';",
          )
          replace_once(
              'app/src/services/sessionExecutionService.ts',
              "export interface SessionDiaryMutation {",
              "export type TerminalTransitionResult =\n    | { status: 'transitioned'; execution: SessionExecution }\n    | { status: 'already_completed'; execution: SessionExecution }\n    | { status: 'already_abandoned'; execution: SessionExecution };\n\nexport interface SessionDiaryMutation {",
          )
          marker = "    /**\n     * Looks up an existing execution for a given date and optional occurrence or prescription."
          insertion = "    async getResumeDiaryState(userId: string, executionId: string) {\n        const [persistedEntries, persistedLastDeletedEntry] = await Promise.all([\n            this.getEntries(userId, executionId),\n            this.getLastDeletedEntry(userId, executionId),\n        ]);\n        return overlayQueuedDiaryState(\n            persistedEntries,\n            persistedLastDeletedEntry,\n            readDiaryReceipts(userId, executionId),\n        );\n    }\n\n    async findLatestCompletedExecution(userId: string, date: string): Promise<SessionExecution | null> {\n        const collRef = collection(this.db, 'users', userId, 'session_executions');\n        const snap = await getDocs(query(collRef, where('date', '==', date)));\n        const candidates: SessionExecution[] = [];\n        for (const docSnap of snap.docs) {\n            const parsed = parseSessionExecutionDocument(docSnap.data(), docSnap.ref.path);\n            if (parsed.status === 'AVAILABLE' && parsed.data.executionId === docSnap.id && parsed.data.state === 'completed') {\n                candidates.push(parsed.data);\n            }\n        }\n        return candidates.sort((left, right) => right.updatedAt.localeCompare(left.updatedAt))[0] ?? null;\n    }\n\n" + marker
          replace_once('app/src/services/sessionExecutionService.ts', marker, insertion)

          transition_marker = "    /**\n     * Transitions an execution's state. Pass `batch`"
          transition_impl = "    async transitionExecutionTerminal(\n        userId: string,\n        executionId: string,\n        targetState: Extract<SessionExecutionState, 'completed' | 'abandoned'>,\n        data?: {\n            sessionRpe?: number;\n            notes?: string;\n            completionEvidence?: SessionCompletionEvidence;\n        },\n        addWinnerWrites?: (batch: WriteBatch, terminalExecution: SessionExecution) => void | Promise<void>,\n    ): Promise<TerminalTransitionResult> {\n        const ref = this.executionRef(userId, executionId);\n        const read = async (): Promise<SessionExecution> => {\n            const snap = await getDoc(ref);\n            if (!snap.exists()) throw new Error(`Session execution ${executionId} does not exist.`);\n            const parsed = parseSessionExecutionDocument(snap.data(), snap.ref.path);\n            if (parsed.status !== 'AVAILABLE' || parsed.data.executionId !== executionId) {\n                throw new Error(`Session execution ${executionId} is invalid.`);\n            }\n            return parsed.data;\n        };\n        const classify = (persisted: SessionExecution): TerminalTransitionResult | null => {\n            if (persisted.state === 'completed') return { status: 'already_completed', execution: persisted };\n            if (persisted.state === 'abandoned') return { status: 'already_abandoned', execution: persisted };\n            return null;\n        };\n\n        const before = await read();\n        const existing = classify(before);\n        if (existing) return existing;\n\n        const now = new Date().toISOString();\n        const terminalExecution: SessionExecution = {\n            ...before,\n            state: targetState,\n            updatedAt: now,\n            ...(targetState === 'completed' ? { completedAt: now } : {}),\n            ...(data?.sessionRpe !== undefined ? { sessionRpe: data.sessionRpe } : {}),\n            ...(data?.notes !== undefined ? { notes: data.notes } : {}),\n            ...(targetState === 'completed' && data?.completionEvidence\n                ? { completionEvidence: data.completionEvidence }\n                : {}),\n        };\n        const patch: Partial<SessionExecution> = {\n            state: targetState,\n            updatedAt: now,\n            ...(targetState === 'completed' ? { completedAt: now } : {}),\n            ...(data?.sessionRpe !== undefined ? { sessionRpe: data.sessionRpe } : {}),\n            ...(data?.notes !== undefined ? { notes: data.notes } : {}),\n            ...(targetState === 'completed' && data?.completionEvidence\n                ? { completionEvidence: data.completionEvidence }\n                : {}),\n        };\n        const batch = writeBatch(this.db);\n        batch.set(ref, patch, { merge: true });\n        if (addWinnerWrites) await addWinnerWrites(batch, terminalExecution);\n        try {\n            await batch.commit();\n            return { status: 'transitioned', execution: terminalExecution };\n        } catch (error) {\n            // A racing terminal winner makes this batch fail under final-state rules. Only\n            // classify that failure as idempotent when a fresh persisted read proves it.\n            try {\n                const latest = await read();\n                const raced = classify(latest);\n                if (raced) return raced;\n            } catch {\n                // Preserve the original write error when we cannot prove a terminal winner.\n            }\n            throw error;\n        }\n    }\n\n" + transition_marker
          replace_once('app/src/services/sessionExecutionService.ts', transition_marker, transition_impl)

          # Firestore rules: new snapshot/evidence fields plus one-way final terminal transition.
          replace_once(
              'app/firestore.rules',
              "        && meta.keys().hasOnly(['title', 'summary', 'intent', 'dominantModality', 'duration'])",
              "        && meta.keys().hasOnly(['title', 'summary', 'intent', 'dominantModality', 'duration', 'movementComposition'])",
          )
          replace_once(
              'app/firestore.rules',
              "    function hasValidExecutionPrescription(userId, prescriptionHash) {",
              "    function hasValidDefinitionSnapshot(snapshot) {\n      return snapshot is map\n        && snapshot.keys().hasOnly(['schemaVersion', 'title', 'summary', 'intent', 'modalities', 'dominantModality', 'duration', 'sessionTargets', 'prohibitedAdditions', 'importWarnings', 'movementComposition', 'blocks'])\n        && snapshot.keys().hasAll(['schemaVersion', 'title', 'intent', 'blocks'])\n        && snapshot.schemaVersion == 1\n        && snapshot.title is string\n        && snapshot.intent is string\n        && snapshot.blocks is list\n        && (!('summary' in snapshot) || snapshot.summary is string)\n        && (!('modalities' in snapshot) || snapshot.modalities is list)\n        && (!('dominantModality' in snapshot) || snapshot.dominantModality is string)\n        && (!('duration' in snapshot) || (snapshot.duration is map && snapshot.duration.min is number && snapshot.duration.max is number))\n        && (!('sessionTargets' in snapshot) || snapshot.sessionTargets is list)\n        && (!('prohibitedAdditions' in snapshot) || snapshot.prohibitedAdditions is list)\n        && (!('importWarnings' in snapshot) || snapshot.importWarnings is list)\n        && (!('movementComposition' in snapshot) || snapshot.movementComposition is list);\n    }\n\n    function hasValidExecutionPrescription(userId, prescriptionHash) {",
          )
          replace_once(
              'app/firestore.rules',
              "        && data.keys().hasOnly(['userId', 'schemaVersion', 'prescriptionHash', 'sessionSource', 'definitionHash', 'blocks', 'displayMetadata', 'createdAt'])",
              "        && data.keys().hasOnly(['userId', 'schemaVersion', 'prescriptionHash', 'sessionSource', 'definitionHash', 'blocks', 'displayMetadata', 'definitionSnapshot', 'createdAt'])",
          )
          replace_once(
              'app/firestore.rules',
              "        && (!('displayMetadata' in data) || hasValidDisplayMetadata(data.displayMetadata))\n        && data.createdAt is string;",
              "        && (!('displayMetadata' in data) || hasValidDisplayMetadata(data.displayMetadata))\n        && (!('definitionSnapshot' in data) || hasValidDefinitionSnapshot(data.definitionSnapshot))\n        && data.createdAt is string;",
          )
          replace_once(
              'app/firestore.rules',
              "    function hasValidSessionExecution(userId, executionId) {",
              "    function hasValidCompletionEvidence(evidence) {\n      return evidence is map\n        && evidence.keys().hasOnly(['submittedAt', 'sessionRpe', 'completedFraction', 'unexpectedFatigue', 'note'])\n        && evidence.keys().hasAll(['submittedAt'])\n        && evidence.submittedAt is string\n        && (!('sessionRpe' in evidence) || (evidence.sessionRpe is number && evidence.sessionRpe >= 0 && evidence.sessionRpe <= 10))\n        && (!('completedFraction' in evidence) || (evidence.completedFraction is number && evidence.completedFraction >= 0 && evidence.completedFraction <= 1))\n        && (!('unexpectedFatigue' in evidence) || evidence.unexpectedFatigue is bool)\n        && (!('note' in evidence) || (evidence.note is string && evidence.note.size() <= 2000));\n    }\n\n    function hasValidSessionExecution(userId, executionId) {",
          )
          replace_once(
              'app/firestore.rules',
              "['userId', 'executionId', 'occurrenceId', 'sessionSource', 'prescriptionHash', 'fitWorkoutFingerprint', 'fitWorkoutFingerprintKind', 'date', 'startedAt', 'completedAt', 'updatedAt', 'state', 'sessionRpe', 'notes', 'schemaVersion']",
              "['userId', 'executionId', 'occurrenceId', 'sessionSource', 'prescriptionHash', 'fitWorkoutFingerprint', 'fitWorkoutFingerprintKind', 'date', 'startedAt', 'completedAt', 'updatedAt', 'state', 'sessionRpe', 'notes', 'completionEvidence', 'schemaVersion']",
          )
          replace_once(
              'app/firestore.rules',
              "        && (!('notes' in data) || (data.notes is string && data.notes.size() <= 4000))\n        && data.state in ['in_progress', 'completed', 'abandoned']",
              "        && (!('notes' in data) || (data.notes is string && data.notes.size() <= 4000))\n        && (!('completionEvidence' in data) || hasValidCompletionEvidence(data.completionEvidence))\n        && (data.state == 'completed' || !('completionEvidence' in data))\n        && data.state in ['in_progress', 'completed', 'abandoned']",
          )
          old_rule = "      allow update: if hasValidSessionExecution(userId, executionId)\n        && keepsOwnership(userId)\n        && resource.data.state == 'in_progress'\n        && request.resource.data.date == resource.data.date\n        && request.resource.data.startedAt == resource.data.startedAt\n        && (!('fitWorkoutFingerprint' in resource.data) ? !('fitWorkoutFingerprint' in request.resource.data) : request.resource.data.fitWorkoutFingerprint == resource.data.fitWorkoutFingerprint)\n        && (!('fitWorkoutFingerprintKind' in resource.data) ? !('fitWorkoutFingerprintKind' in request.resource.data) : request.resource.data.fitWorkoutFingerprintKind == resource.data.fitWorkoutFingerprintKind);"
          new_rule = "      allow update: if hasValidSessionExecution(userId, executionId)\n        && keepsOwnership(userId)\n        && resource.data.state == 'in_progress'\n        && request.resource.data.state in ['completed', 'abandoned']\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['state', 'updatedAt', 'completedAt', 'sessionRpe', 'notes', 'completionEvidence'])\n        && request.resource.data.date == resource.data.date\n        && request.resource.data.startedAt == resource.data.startedAt\n        && request.resource.data.sessionSource == resource.data.sessionSource\n        && (!('occurrenceId' in resource.data) ? !('occurrenceId' in request.resource.data) : request.resource.data.occurrenceId == resource.data.occurrenceId)\n        && (!('prescriptionHash' in resource.data) ? !('prescriptionHash' in request.resource.data) : request.resource.data.prescriptionHash == resource.data.prescriptionHash)\n        && (!('fitWorkoutFingerprint' in resource.data) ? !('fitWorkoutFingerprint' in request.resource.data) : request.resource.data.fitWorkoutFingerprint == resource.data.fitWorkoutFingerprint)\n        && (!('fitWorkoutFingerprintKind' in resource.data) ? !('fitWorkoutFingerprintKind' in request.resource.data) : request.resource.data.fitWorkoutFingerprintKind == resource.data.fitWorkoutFingerprintKind)\n        && ((request.resource.data.state == 'completed'\n              && request.resource.data.completedAt == request.resource.data.updatedAt)\n            || (request.resource.data.state == 'abandoned'\n              && !('completedAt' in request.resource.data)\n              && !('completionEvidence' in request.resource.data)));"
          replace_once('app/firestore.rules', old_rule, new_rule)
          PY
      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/_wp2_wp3_apply.yml
      - name: Commit core patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(sessions): make lifecycle terminal and replay exact (#895)"
          git push origin HEAD:feat/895-wp2-wp3-lifecycle-resume
