name: One-shot patch external-plan v4 Firestore rules

on:
  push:
    branches:
      - claude/cycling-primary-hybrid-eval-e166ea

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/cycling-primary-hybrid-eval-e166ea
          fetch-depth: 0

      - name: Apply guarded external-plan@4 rules patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/firestore.rules')
          text = path.read_text()
          replacements = [
              (
                  "// ADR-0035: rules validate the bounded per-directive storage shape for v3. The",
                  "// ADR-0035/0036: rules validate the bounded plan-level storage shape for v3/v4. The",
              ),
              (
                  "          'adaptive-training-recommender/external-plan@3',\n        ]",
                  "          'adaptive-training-recommender/external-plan@3',\n          'adaptive-training-recommender/external-plan@4',\n        ]",
              ),
              (
                  "        && (data.schema == 'adaptive-training-recommender/external-plan@3'",
                  "        && (data.schema in ['adaptive-training-recommender/external-plan@3', 'adaptive-training-recommender/external-plan@4']",
              ),
              (
                  "        && (data.schema != 'adaptive-training-recommender/external-plan@3'\n          || hasValidExternalRestDirectives(data.restDays, data.weekCount))",
                  "        && (!(data.schema in ['adaptive-training-recommender/external-plan@3', 'adaptive-training-recommender/external-plan@4'])\n          || hasValidExternalRestDirectives(data.restDays, data.weekCount))",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one guarded rules fragment, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-v4-firestore-rules.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/firestore.rules .github/workflows/patch-v4-firestore-rules.yml
          git diff --cached --check
          git diff --cached -- app/firestore.rules
          git commit -m "fix(rules): allow external-plan@4 revision persistence"
          git push origin HEAD:claude/cycling-primary-hybrid-eval-e166ea
