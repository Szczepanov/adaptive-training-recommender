name: One-shot patch external-plan v4 Firestore rules

on:
  push:
    branches:
      - claude/cycling-primary-hybrid-eval-e166ea

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/cycling-primary-hybrid-eval-e166ea
          fetch-depth: 0

      - name: Apply guarded external-plan@4 rules patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/firestore.rules')
          text = path.read_text()
          old = """    function hasValidExternalPlanRevision() {
      let data = request.resource.data;
      // ADR-0035: rules validate the bounded per-directive storage shape for v3. The
      // TypeScript import validator remains authoritative for cross-entry invariants such
      // as id/date uniqueness and fixed-session/rest conflicts, which require viewing the
      // two authored lists together.
      return data.keys().hasAll(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'sessions'])
        && data.schema in [
          'adaptive-training-recommender/external-plan@1',
          'adaptive-training-recommender/external-plan@2',
          'adaptive-training-recommender/external-plan@3',
        ]
        && (data.schema == 'adaptive-training-recommender/external-plan@3'
              ? data.keys().hasOnly(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'notes', 'sessions', 'restDays'])
                 && data.keys().hasAll(['restDays'])
              : data.keys().hasOnly(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'notes', 'sessions']))
        && data.revision is int && data.revision >= 1
        && isValidActivityDate(data.startDate)
        && data.weekCount is int && data.weekCount >= 1 && data.weekCount <= 26
        && (data.schema != 'adaptive-training-recommender/external-plan@3'
          || hasValidExternalRestDirectives(data.restDays, data.weekCount))
        && data.sessions is list && data.sessions.size() >= 1 && data.sessions.size() <= 120;
    }
"""
          new = """    function hasValidExternalPlanRevision() {
      let data = request.resource.data;
      // ADR-0035/0036: rules validate the bounded plan-level storage shape for v3/v4.
      // The TypeScript import validator remains authoritative for session structure and
      // cross-entry invariants (including v4 intraday bundle/window relationships), which
      // require viewing the authored session/rest lists together.
      let hasAuthoredRestContract = data.schema in [
        'adaptive-training-recommender/external-plan@3',
        'adaptive-training-recommender/external-plan@4',
      ];
      return data.keys().hasAll(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'sessions'])
        && data.schema in [
          'adaptive-training-recommender/external-plan@1',
          'adaptive-training-recommender/external-plan@2',
          'adaptive-training-recommender/external-plan@3',
          'adaptive-training-recommender/external-plan@4',
        ]
        && (hasAuthoredRestContract
              ? data.keys().hasOnly(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'notes', 'sessions', 'restDays'])
                 && data.keys().hasAll(['restDays'])
              : data.keys().hasOnly(['schema', 'planId', 'revision', 'title', 'startDate', 'weekCount', 'notes', 'sessions']))
        && data.revision is int && data.revision >= 1
        && isValidActivityDate(data.startDate)
        && data.weekCount is int && data.weekCount >= 1 && data.weekCount <= 26
        && (!hasAuthoredRestContract || hasValidExternalRestDirectives(data.restDays, data.weekCount))
        && data.sessions is list && data.sessions.size() >= 1 && data.sessions.size() <= 120;
    }
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one external-plan rules block, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-v4-firestore-rules.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/firestore.rules .github/workflows/patch-v4-firestore-rules.yml
          git diff --cached --check
          git commit -m "fix(rules): allow external-plan@4 revision persistence"
          git push origin HEAD:claude/cycling-primary-hybrid-eval-e166ea
