name: Deploy Frontend & Firestore Rules

# Deploys the web app to Firebase Hosting and/or Firestore Security Rules without needing a
# local machine -- works the same way as deploy-garmin-sync.yml (see that workflow and
# docs/ops/setup-workload-identity.sh for the design rationale). One-time prerequisite: rerun
# docs/ops/setup-workload-identity.sh (idempotent) -- it now also provisions the
# github-frontend-deployer identity this workflow authenticates as, and prints the repo
# secret this workflow reads below.
#
# Deliberately a SEPARATE identity from garmin-sync's github-deployer: github-frontend-deployer
# holds Firebase Hosting/Rules plus the dedicated Firestore index role used by the separate
# deploy-firestore-indexes.yml workflow, and roles/run.viewer scoped only to the
# garmin-account-link service so Hosting can validate its rewrite. It has nothing about
# Artifact Registry or Cloud Scheduler -- see docs/ops/frontend-deployment.md.
#
# Firestore indexes remain a separate deployment unit because index construction is
# asynchronous and needs its own readiness gate. The production E2E workflow calls that unit
# before this workflow's rules/hosting stages.
on:
  workflow_dispatch:
    inputs:
      deploy_hosting:
        description: "Build and deploy the web app to Firebase Hosting"
        type: boolean
        required: true
        default: true
      deploy_rules:
        description: "Deploy app/firestore.rules"
        type: boolean
        required: true
        default: true
      confirm_rules_drift:
        description: "I reviewed Firestore rules drift and intend to replace production with the repo version"
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      deploy_hosting:
        description: "Build and deploy the web app to Firebase Hosting"
        type: boolean
        required: false
        default: true
      deploy_rules:
        description: "Deploy app/firestore.rules"
        type: boolean
        required: false
        default: true
      confirm_rules_drift:
        description: "Reviewed Firestore rules drift may be replaced with the repository version"
        type: boolean
        required: false
        default: false
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
      GCP_FRONTEND_DEPLOYER_SA_EMAIL:
        required: true
      # Build-time Firebase values are optional at the reusable-workflow boundary so a
      # rules-only call does not depend on unrelated Hosting configuration. Hosting calls
      # still fail safely if their required build values are absent or point at another project.
      VITE_FIREBASE_API_KEY:
        required: false
      VITE_FIREBASE_AUTH_DOMAIN:
        required: false
      VITE_FIREBASE_PROJECT_ID:
        required: false
      VITE_FIREBASE_STORAGE_BUCKET:
        required: false
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        required: false
      VITE_FIREBASE_APP_ID:
        required: false
      VITE_FIREBASE_MEASUREMENT_ID:
        required: false
      VITE_HEALTH_ANOMALY_POLICY:
        required: false

permissions:
  contents: read
  id-token: write # required for keyless Workload Identity Federation auth

# A second manual run started before the first finishes could both pass the Firestore drift
# check, then race to deploy -- the later one silently wins and clobbers the earlier release.
# Queue instead of running concurrently; never cancel a deploy that's already underway.
#
# A standalone workflow_dispatch run joins the SAME group deploy-production.yml holds for a
# whole release, so it queues behind an in-flight end-to-end release instead of deploying a
# different SHA mid-release. A workflow_call invocation (i.e. from deploy-production.yml
# itself, for both the rules and hosting stages) uses this workflow's own isolated group
# instead: that caller already holds the production-wide group for the run's whole duration,
# so requesting it again here would queue this job behind the very run it's part of and
# deadlock.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_call'
      && format('deploy-frontend-{0}', github.repository)
      || format('deploy-production-{0}', github.repository) }}
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }} # process-scoped; never mutates a persisted gcloud config

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # this job never needs to push; don't leave the token in git config

      - name: Require at least one deployment target
        if: ${{ !inputs.deploy_hosting && !inputs.deploy_rules }}
        run: |
          echo "Both deploy_hosting and deploy_rules are false -- nothing to do. Enable at least one." >&2
          exit 1

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FRONTEND_DEPLOYER_SA_EMAIL }}

      # Needed for `gcloud auth application-default print-access-token`, which
      # scripts/check-firestore-rules-drift.mjs calls to read the deployed ruleset via the
      # Firebase Rules REST API -- it picks up the WIF credentials the auth step just wrote to
      # GOOGLE_APPLICATION_CREDENTIALS as Application Default Credentials automatically.
      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # Only firestore:rules:deploy needs this (it runs the emulator suite before deploying),
      # but it's cheap enough to always install rather than condition on deploy_rules.
      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      # The project-ID check below only catches a Firebase project mismatch. It says nothing
      # about the other values app/src/firebase.ts reads -- a missing API key, auth domain, or
      # app ID still produces a successful static build whose Firebase client silently fails at
      # runtime, and neither the Hosting nor the rewrite smoke check below would catch that
      # (they only exercise static assets and the Cloud Run rewrite, not Firebase client init).
      - name: Validate Firebase build configuration is complete
        if: ${{ inputs.deploy_hosting }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          missing=""
          for var in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_STORAGE_BUCKET \
                     VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID; do
            if [ -z "${!var}" ]; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "Missing required Firebase build configuration:${missing}" >&2
            echo "app/src/firebase.ts needs all of these set to produce a working runtime Firebase config -- refusing to build." >&2
            exit 1
          fi

      # Firebase project ID and GCP project ID are the same string for this project (see
      # docs/ops/cloud-run-deployment.md), but they're two independently-set secrets --
      # nothing stops them drifting apart. If they ever did, this would build correctly and
      # deploy successfully, just to the wrong Firebase project, silently. Fail before build.
      - name: Verify VITE_FIREBASE_PROJECT_ID matches GCP_PROJECT_ID
        if: ${{ inputs.deploy_hosting }}
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ "${VITE_FIREBASE_PROJECT_ID}" != "${GCP_PROJECT}" ]; then
            echo "VITE_FIREBASE_PROJECT_ID (${VITE_FIREBASE_PROJECT_ID}) != GCP_PROJECT_ID (${GCP_PROJECT}) -- refusing to deploy to a possibly-wrong Firebase project." >&2
            exit 1
          fi

      # `npm run build` runs the full `npm run check` first (typecheck, lint, unit tests,
      # workout-catalog validation) -- never deploy a build that hasn't passed those.
      - name: Build frontend
        if: ${{ inputs.deploy_hosting }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # HA-D developer evidence collection (see app/.env.example). Forwarding the repo
          # secret here is required -- Vite only inlines VITE_* vars present in the build-time
          # environment, and a missing value fails closed to 'off' by design
          # (resolveConfiguredHealthAnomalyShadowPolicy), so without this line the secret being
          # set has no effect on the deployed build.
          VITE_HEALTH_ANOMALY_POLICY: ${{ secrets.VITE_HEALTH_ANOMALY_POLICY }}
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GIT_DIRTY: "false"
        run: npm run build

      # `npm exec --no --` (rather than bare `npx`) refuses to fall back to fetching an
      # unreviewed package version from the registry if firebase-tools somehow isn't already
      # installed -- it only ever runs the exact lockfile-pinned local binary.
      - name: Deploy to Firebase Hosting
        if: ${{ inputs.deploy_hosting }}
        run: npm exec --no -- firebase deploy --only hosting --project "${GCP_PROJECT}" --non-interactive

      - name: Smoke test Firebase Hosting
        if: ${{ inputs.deploy_hosting }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "https://${GCP_PROJECT}.web.app/" >/dev/null

      # GET /api/garmin/login is intentionally unsupported by the account-link service. A
      # backend-shaped 404 therefore proves the Hosting rewrite reached Cloud Run without
      # submitting credentials or consuming a login-rate-limit attempt.
      - name: Smoke test Hosting to Garmin API rewrite
        if: ${{ inputs.deploy_hosting }}
        run: |
          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --output "${BODY_FILE}" --write-out '%{http_code}' \
            "https://${GCP_PROJECT}.web.app/api/garmin/login")"
          if [ "${STATUS}" != "404" ] || ! grep -q '"error":"not_found"' "${BODY_FILE}"; then
            echo "Expected Cloud Run JSON 404 through Firebase Hosting rewrite; got HTTP ${STATUS}." >&2
            cat "${BODY_FILE}" >&2
            exit 1
          fi

      # Default path remains fail-closed: unexpected drift stops the run before any rules
      # deployment. This is the safe choice for ordinary frontend/rules deploys.
      - name: Check Firestore rules drift (fail closed)
        if: ${{ inputs.deploy_rules && !inputs.confirm_rules_drift }}
        run: npm run firestore:rules:drift

      # An intentional repository rules change necessarily means local != deployed before
      # deployment. The operator must explicitly acknowledge that mismatch in workflow_dispatch.
      # --allow-drift only changes this pre-deploy gate; the deployment script still saves the
      # active ruleset for rollback, runs the emulator suite, deploys only Firestore rules, and
      # verifies the deployed source hash matches app/firestore.rules afterwards.
      - name: Acknowledge reviewed Firestore rules drift
        if: ${{ inputs.deploy_rules && inputs.confirm_rules_drift }}
        run: npm run firestore:rules:drift -- --allow-drift

      - name: Deploy Firestore security rules
        if: ${{ inputs.deploy_rules }}
        run: npm run firestore:rules:deploy -- --confirm

      # The deploy script writes a rollback JSON to app/artifacts/firestore-rules-rollbacks/
      # (gitignored, and the runner is thrown away after this job) -- upload it so a rollback
      # is still possible after the fact. Download it and run
      # `npm run firestore:rules:rollback -- --backup <file> --confirm` locally per
      # docs/ops/firestore-rules-deployment.md#rollback (rollback itself stays a local,
      # deliberate operation, same as before this workflow existed).
      - name: Upload Firestore rules rollback backup
        if: always() && inputs.deploy_rules
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-rollback-backup
          path: app/artifacts/firestore-rules-rollbacks/
          if-no-files-found: ignore
