name: Finalize PR 297 architecture wording

on:
  push:
    branches: [ feat/multisport-running-triathlon-support ]

permissions:
  contents: write

jobs:
  patch-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Align architecture wording with objective policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/recommendation-engine.md')
          text = path.read_text()
          old = "Event-directed cycling uses `structured_plan`; Running, triathlon, strength, and general events retain demand-derived planning. Running aerobic objectives are modality-scoped and half-marathon/marathon demand adds a long-run durability objective. Triathlon demand creates separate swim, bike, and run aerobic objectives so one discipline cannot silently satisfy the whole sport. Outdoor cycling and swimming are hard-gated by declared bicycle/swim access."
          new = "Event-directed cycling uses `structured_plan`; Running, triathlon, strength, and general events retain demand-derived planning. Running race-specific objectives are modality-scoped and half-marathon/marathon demand adds a long-run durability objective; the generic single-sport aerobic-base objective intentionally remains cross-training-creditable. Triathlon demand creates separate swim, bike, and run aerobic objectives so one discipline cannot silently satisfy the whole sport. Outdoor cycling and swimming are hard-gated by declared bicycle/swim access."
          if text.count(old) != 1:
              raise SystemExit(f'expected architecture sentence exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-pr-297-doc.yml
          git add docs/architecture/recommendation-engine.md
          git commit -m "docs(multisport): align architecture objective policy"
          git push origin HEAD:feat/multisport-running-triathlon-support
