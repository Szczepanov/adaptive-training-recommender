name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    secrets:
      # Optional: push/pull_request triggers already see the repo's full secret set directly,
      # so this only matters for a workflow_call caller (deploy-production.yml), which must
      # pass it explicitly instead of `secrets: inherit`. Frontend-build's own env fixes every
      # other Firebase value to a build/test-only placeholder, so only the API key is real.
      VITE_FIREBASE_API_KEY:
        required: false

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same PR branch -- only the latest
# commit's result matters for merge, and letting a stale run finish just burns runner minutes
# behind the new one. Scoped to pull_request only: a direct push to main, and the
# workflow_call this workflow serves as deploy-production.yml's release gate (inherits the
# caller's workflow_dispatch event, never 'pull_request'), must never be cancelled by an
# unrelated later run -- cancelling a mid-release validate run would break the production
# release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          python3 scripts/detect_ci_changes.py "${{ github.event.pull_request.base.sha || 'origin/main' }}"

  docs-hygiene:
    name: Documentation & Security Hygiene
    if: needs.detect-changes.outputs.docs_only == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run repository hygiene pre-commit checks
        env:
          # Verify trailing whitespace, yaml/json syntax, and gitleaks secrets detection on doc PRs
          SKIP: uv-lock,ruff-check,ruff-format,mypy,eslint
        run: uv run pre-commit run --all-files --show-diff-on-failure

  python-tests:
    name: Python Test Suite (${{ matrix.python-version }})
    if: needs.detect-changes.outputs.code_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify dependency lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run repository hygiene pre-commit checks
        env:
          # Dedicated CI steps below own these checks. Skip their pre-commit copies so
          # the matrix does not repeat Ruff/mypy/lock work or install Node just for ESLint.
          SKIP: uv-lock,ruff-check,ruff-format,mypy,eslint
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint Python with ruff
        run: uv run ruff check .

      - name: Check Python formatting with ruff
        run: uv run ruff format --check .

      - name: Type check Python with mypy
        run: uv run mypy src/garmin_sync

      - name: Run pytest with coverage summary
        run: |
          mkdir -p artifacts/coverage/python
          uv run pytest --cov=garmin_sync --cov-report=term-missing --cov-report=xml:artifacts/coverage/python/coverage.xml

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: artifacts/coverage/python
          if-no-files-found: warn

      - name: Python dependency audit
        run: uvx pip-audit

  frontend-hygiene:
    name: Frontend Hygiene & Static Gates
    if: needs.detect-changes.outputs.code_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      # Build/test-only configuration. Production configuration remains deployment-owned.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: example-project
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
    defaults:
      run:
        working-directory: app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Node dependency audit
        shell: bash
        run: |
          # Audit high/critical vulnerabilities immediately after install while the tree is pristine.
          # Include a single retry with backoff in case the npm registry security endpoint times out.
          npm audit --audit-level=high || {
            echo "npm audit returned an error or registry timeout; retrying once..." >&2
            sleep 5
            npm audit --audit-level=high
          }

      - name: Type check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Validate sports knowledge registry
        run: npm run validate:knowledge

      - name: Validate engine knowledge coverage
        run: npm run validate:knowledge-coverage

      - name: Validate workout library
        run: npm run validate:workouts

      - name: Check engine policy version drift
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          # workflow_call inherits the caller event. A production workflow_dispatch has
          # neither pull_request.base.sha nor push.before, so compare the release commit to
          # its first parent instead of silently skipping the policy-version gate.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/check-policy-drift.mjs "${BASE_SHA}"

      - name: Build frontend bundle
        run: npm run build:bundle

  frontend-tests:
    name: Frontend Unit Tests & Firestore Rules
    if: needs.detect-changes.outputs.code_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Run frontend test suite with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: app/artifacts/coverage/frontend
          if-no-files-found: warn

      - name: Run Firestore security-rule emulator suite
        run: npm run test:rules

  engine-simulations:
    name: Engine Simulations & AI Gates
    if: needs.detect-changes.outputs.code_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run simulation scenarios & aggregate bounds gate
        run: |
          npm run simulate:scenarios
          git diff --exit-code -- ../docs/analysis/simulation-baseline.json

      - name: Run AI plan judge deterministic corpus gate
        run: npm run simulate:plan-judge

      - name: Build persona judge deterministic corpus
        run: node scripts/run-persona-ai-judge.mjs --build-only

      - name: Report simulation semantic diff
        run: npm run simulate:diff
        continue-on-error: true

  docker-build:
    name: Docker Build & Compose Smoke
    if: needs.detect-changes.outputs.code_changed == 'true'
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Shared build-time/runtime placeholders for the Docker Compose smoke stack. Hoisted to
      # job level (rather than repeated per-step) so the pre-warm build steps below pass
      # `docker compose build` the exact same build-arg values it will use itself -- a
      # mismatched value is a different BuildKit cache key and silently defeats the cache.
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
      VITE_FIREBASE_MEASUREMENT_ID: G-TEST
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Plain `docker build` never persists layers between runs -- every CI run re-pulled
      # python:3.14-slim and re-ran `uv sync` from a cold cache. Building through buildx with
      # the GitHub Actions cache backend (type=gha) reuses those layers across runs and only
      # rebuilds what actually changed (the Dockerfile already orders COPY src after
      # `uv sync --no-install-project`, so a src/-only change still hits the cached dependency
      # layer). `load: true` keeps prior behavior of leaving the image in the local Docker
      # daemon, even though nothing downstream in this job currently references its tag.
      # `mode=max` (not the default `mode=min`) is required for a multi-stage build like this
      # one: the expensive `uv sync` layers live only in the discarded `builder` stage, and
      # mode=min only persists cache for layers that survive into the final exported image.
      # Distinct `scope` values keep this cache and the frontend image's below from colliding
      # -- they'd otherwise share the same default GHA cache scope and evict each other.
      - name: Build root Garmin sync Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: adaptive-training-garmin-sync:latest
          load: true
          cache-from: type=gha,scope=garmin-sync
          cache-to: type=gha,mode=max,scope=garmin-sync

      # Same rationale as the image above -- app/Dockerfile's builder stage runs
      # `npm ci --legacy-peer-deps`, previously uncached across runs. This doesn't need its
      # own tag consumed anywhere: it exists to warm BuildKit's local cache for this exact
      # context/Dockerfile/build-arg combination, so the "Build Docker Compose services" step
      # below rebuilds the same frontend image as a fast cache hit instead of from scratch.
      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: app
          file: app/Dockerfile
          tags: adaptive-training-recommender-frontend:cache-warm
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ env.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Create mock service account for smoke test
        run: |
          python3 -c "import json, subprocess; pem = subprocess.check_output(['openssl', 'genrsa', '2048'], stderr=subprocess.DEVNULL).decode(); json.dump({'type':'service_account','project_id':'test-project','private_key_id':'mock-key','private_key':pem,'client_email':'mock@test-project.iam.gserviceaccount.com','token_uri':'https://oauth2.googleapis.com/token'}, open('firebase-service-account.json', 'w'))"

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start services and wait for healthchecks
        env:
          APP_USER_ID: test-user
          GARMIN_TOKEN_BUCKET: test-bucket
          GCP_PROJECT_ID: test-project
        run: docker compose up -d --wait --wait-timeout 90

      - name: Smoke test full-stack routing and headers
        run: python3 scripts/docker_compose_smoke.py

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up containers
        if: always()
        run: docker compose down -v

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - detect-changes
      - docs-hygiene
      - python-tests
      - frontend-hygiene
      - frontend-tests
      - engine-simulations
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify overall CI result
        shell: bash
        run: |
          echo "Job results:"
          echo "  detect-changes: ${{ needs.detect-changes.result }}"
          echo "  docs-hygiene: ${{ needs.docs-hygiene.result }}"
          echo "  python-tests: ${{ needs.python-tests.result }}"
          echo "  frontend-hygiene: ${{ needs.frontend-hygiene.result }}"
          echo "  frontend-tests: ${{ needs.frontend-tests.result }}"
          echo "  engine-simulations: ${{ needs.engine-simulations.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"

          for result in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.docs-hygiene.result }}" \
            "${{ needs.python-tests.result }}" \
            "${{ needs.frontend-hygiene.result }}" \
            "${{ needs.frontend-tests.result }}" \
            "${{ needs.engine-simulations.result }}" \
            "${{ needs.docker-build.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required CI job did not succeed (status: $result)." >&2
              exit 1
            fi
          done

          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "detect-changes job did not succeed." >&2
            exit 1
          fi

          echo "All required CI jobs completed successfully."
