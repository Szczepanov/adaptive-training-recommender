name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    secrets:
      # Optional: push/pull_request triggers already see the repo's full secret set directly,
      # so this only matters for a workflow_call caller (deploy-production.yml), which must
      # pass it explicitly instead of `secrets: inherit`. Frontend-build's own env fixes every
      # other Firebase value to a build/test-only placeholder, so only the API key is real.
      VITE_FIREBASE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify dependency lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run repository hygiene pre-commit checks
        env:
          # Dedicated CI steps below own these checks. Skip their pre-commit copies so
          # the matrix does not repeat Ruff/mypy/lock work or install Node just for ESLint.
          SKIP: uv-lock,ruff-check,ruff-format,mypy,eslint
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint Python with ruff
        run: uv run ruff check .

      - name: Check Python formatting with ruff
        run: uv run ruff format --check .

      - name: Type check Python with mypy
        run: uv run mypy src/garmin_sync

      - name: Run pytest with coverage summary
        run: |
          mkdir -p artifacts/coverage/python
          uv run pytest --cov=garmin_sync --cov-report=term-missing --cov-report=xml:artifacts/coverage/python/coverage.xml

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: artifacts/coverage/python
          if-no-files-found: warn

      - name: Python dependency audit
        run: uvx pip-audit

  frontend-build:
    name: Frontend Build & Firestore Rules
    runs-on: ubuntu-latest
    env:
      # Build/test-only configuration. Production configuration remains deployment-owned.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: example-project
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Validate sports knowledge registry
        run: npm run validate:knowledge

      - name: Validate engine knowledge coverage
        run: npm run validate:knowledge-coverage

      - name: Validate workout library
        run: npm run validate:workouts

      - name: Check engine policy version drift
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          # workflow_call inherits the caller event. A production workflow_dispatch has
          # neither pull_request.base.sha nor push.before, so compare the release commit to
          # its first parent instead of silently skipping the policy-version gate.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node scripts/check-policy-drift.mjs "${BASE_SHA}"

      - name: Run frontend test suite with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: app/artifacts/coverage/frontend
          if-no-files-found: warn

      - name: Run Firestore security-rule emulator suite
        run: npm run test:rules

      - name: Run simulation scenarios & aggregate bounds gate
        run: |
          npm run simulate:scenarios
          git diff --exit-code -- ../docs/analysis/simulation-baseline.json

      - name: Run AI plan judge deterministic corpus gate
        run: npm run simulate:plan-judge

      - name: Build persona judge deterministic corpus
        run: node scripts/run-persona-ai-judge.mjs --build-only

      - name: Report simulation semantic diff
        run: npm run simulate:diff
        continue-on-error: true

      - name: Build frontend bundle
        run: npm run build:bundle

      - name: Node dependency audit
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build & Compose Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build root Garmin sync Docker image
        run: docker build -t adaptive-training-garmin-sync .

      - name: Create mock service account for smoke test
        run: |
          python3 -c "import json, subprocess; pem = subprocess.check_output(['openssl', 'genrsa', '2048'], stderr=subprocess.DEVNULL).decode(); json.dump({'type':'service_account','project_id':'test-project','private_key_id':'mock-key','private_key':pem,'client_email':'mock@test-project.iam.gserviceaccount.com','token_uri':'https://oauth2.googleapis.com/token'}, open('firebase-service-account.json', 'w'))"

      - name: Validate Docker Compose configuration
        env:
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
          VITE_FIREBASE_MEASUREMENT_ID: G-TEST
        run: docker compose config

      - name: Build Docker Compose services
        env:
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
          VITE_FIREBASE_MEASUREMENT_ID: G-TEST
        run: docker compose build

      - name: Start services and wait for healthchecks
        env:
          APP_USER_ID: test-user
          GARMIN_TOKEN_BUCKET: test-bucket
          GCP_PROJECT_ID: test-project
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_PROJECT_ID: test-project
        run: docker compose up -d --wait --wait-timeout 90

      - name: Smoke test full-stack routing and headers
        run: python3 scripts/docker_compose_smoke.py

      - name: Display container logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up containers
        if: always()
        run: docker compose down -v
