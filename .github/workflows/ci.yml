name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  patch-ov-evaluation-rules:
    name: Temporary OV5.1 rules patch
    if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/performance-outcome-validation-progress'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Insert frozen evaluation rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/firestore.rules')
          text = path.read_text()
          marker = '    // --- OV5.1: immutable outcome-evaluation criteria and lifecycle.\n'
          if marker in text:
              raise SystemExit(0)
          anchor = '    function hasValidCompetitionOutcome(userId, outcomeId) {'
          if anchor not in text:
              raise SystemExit('Outcome rules insertion anchor not found')
          block = r'''    // --- OV5.1: immutable outcome-evaluation criteria and lifecycle.
    // Metric bindings are embedded in the revision document so activation freezes the
    // exact bounded criteria atomically with the revision hash.
    function outcomeEvaluationHeadAfterRevision(userId, evaluationId, revision) {
      let headPath = /databases/$(database)/documents/users/$(userId)/outcome_evaluations/$(evaluationId);
      let head = getAfter(headPath).data;
      return head.id == evaluationId && head.currentRevision == revision;
    }

    function outcomeEvaluationRevisionAfterHead(userId, evaluationId, revision) {
      let revisionPath = /databases/$(database)/documents/users/$(userId)/outcome_evaluations/$(evaluationId)/revisions/$(string(revision));
      let next = getAfter(revisionPath).data;
      return next.id == evaluationId && next.revision == revision && next.status == 'draft';
    }

    function hasValidOutcomeEvaluationHead(userId, evaluationId) {
      let data = request.resource.data;
      return isOwner(userId)
        && data.keys().hasOnly(['id', 'currentRevision', 'createdAt', 'updatedAt'])
        && data.keys().hasAll(['id', 'currentRevision', 'createdAt', 'updatedAt'])
        && data.id == evaluationId
        && data.id is string && data.id.size() > 0 && data.id.size() <= 160
        && data.currentRevision is int && data.currentRevision >= 1
        && data.createdAt is string && data.createdAt.size() > 0
        && data.updatedAt is string && data.updatedAt.size() > 0;
    }

    function hasValidOutcomeEvaluationSourceRef(sourceRef) {
      return sourceRef is map
        && sourceRef.keys().hasOnly(['kind', 'id'])
        && sourceRef.keys().hasAll(['kind', 'id'])
        && sourceRef.kind in ['event', 'authored_plan', 'manual_block']
        && sourceRef.id is string && sourceRef.id.size() > 0 && sourceRef.id.size() <= 256;
    }

    function hasValidOutcomeEvaluationRevision(userId, evaluationId, revisionId) {
      let data = request.resource.data;
      return isOwner(userId)
        && data.keys().hasOnly(['id', 'revision', 'title', 'startDate', 'endDate', 'sourceRef', 'status', 'activatedAt', 'contentHash', 'createdAt', 'bindings'])
        && data.keys().hasAll(['id', 'revision', 'title', 'startDate', 'endDate', 'status', 'contentHash', 'createdAt', 'bindings'])
        && data.id == evaluationId
        && data.id is string && data.id.size() > 0 && data.id.size() <= 160
        && data.revision is int && data.revision >= 1 && string(data.revision) == revisionId
        && data.title is string && data.title.size() > 0 && data.title.size() <= 200
        && isValidActivityDate(data.startDate)
        && isValidActivityDate(data.endDate)
        && data.startDate <= data.endDate
        && (!('sourceRef' in data) || hasValidOutcomeEvaluationSourceRef(data.sourceRef))
        && data.status in ['draft', 'active', 'completed', 'archived']
        && data.bindings is list && data.bindings.size() >= 1 && data.bindings.size() <= 16
        && data.createdAt is string && data.createdAt.size() > 0
        && (
          (data.status == 'draft'
            && !('activatedAt' in data)
            && data.contentHash == '')
          || (data.status != 'draft'
            && data.activatedAt is string && data.activatedAt.size() > 0
            && data.contentHash is string
            && data.contentHash.matches('^[0-9a-f]{64}$'))
        );
    }

    match /users/{userId}/outcome_evaluations/{evaluationId} {
      allow read: if isOwner(userId);
      allow create: if hasValidOutcomeEvaluationHead(userId, evaluationId)
        && request.resource.data.currentRevision == 1
        && outcomeEvaluationRevisionAfterHead(userId, evaluationId, 1);
      allow update: if hasValidOutcomeEvaluationHead(userId, evaluationId)
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['currentRevision', 'updatedAt'])
        && request.resource.data.createdAt == resource.data.createdAt
        && request.resource.data.currentRevision == resource.data.currentRevision + 1
        && outcomeEvaluationRevisionAfterHead(userId, evaluationId, request.resource.data.currentRevision);
      allow delete: if false;

      match /revisions/{revisionId} {
        allow read: if isOwner(userId);
        allow create: if hasValidOutcomeEvaluationRevision(userId, evaluationId, revisionId)
          && request.resource.data.status == 'draft'
          && outcomeEvaluationHeadAfterRevision(userId, evaluationId, request.resource.data.revision)
          && (
            (request.resource.data.revision == 1
              && !exists(/databases/$(database)/documents/users/$(userId)/outcome_evaluations/$(evaluationId)))
            || (request.resource.data.revision > 1
              && get(/databases/$(database)/documents/users/$(userId)/outcome_evaluations/$(evaluationId)).data.currentRevision == request.resource.data.revision - 1)
          );
        allow update: if hasValidOutcomeEvaluationRevision(userId, evaluationId, revisionId)
          && request.resource.data.id == resource.data.id
          && request.resource.data.revision == resource.data.revision
          && request.resource.data.createdAt == resource.data.createdAt
          && (
            (resource.data.status == 'draft'
              && request.resource.data.status == 'active'
              && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'activatedAt', 'contentHash']))
            || (resource.data.status == 'active'
              && request.resource.data.status == 'completed'
              && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status']))
            || (resource.data.status == 'completed'
              && request.resource.data.status == 'archived'
              && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status']))
          );
        allow delete: if false;
      }
    }

'''
          path.write_text(text.replace(anchor, block + anchor, 1))
      - name: Commit rules patch
        run: |
          if git diff --quiet -- app/firestore.rules; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/firestore.rules
          git commit -m "feat(ov5): enforce frozen evaluation Firestore lifecycle"
          git push origin HEAD:chatgpt/performance-outcome-validation-progress

  python-tests:
    name: Python Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify dependency lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Lint Python with ruff
        run: uv run ruff check .

      - name: Check Python formatting with ruff
        run: uv run ruff format --check .

      - name: Type check Python with mypy
        run: uv run mypy src/garmin_sync

      - name: Run pytest with coverage summary
        run: |
          mkdir -p artifacts/coverage/python
          uv run pytest --cov=garmin_sync --cov-report=term-missing --cov-report=xml:artifacts/coverage/python/coverage.xml

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: artifacts/coverage/python
          if-no-files-found: warn

      - name: Python dependency audit
        run: uvx pip-audit

  frontend-build:
    name: Frontend Build & Firestore Rules
    runs-on: ubuntu-latest
    env:
      # Build/test-only configuration. Production configuration remains deployment-owned.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: example-project
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Validate workout library
        run: npm run validate:workouts

      - name: Check engine policy version drift
        run: node scripts/check-policy-drift.mjs ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Run frontend test suite
        run: npm test

      - name: Generate frontend coverage report
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: app/artifacts/coverage/frontend
          if-no-files-found: warn

      - name: Run Firestore security-rule emulator suite
        run: npm run test:rules

      - name: Run simulation scenarios & aggregate bounds gate
        run: |
          npm run simulate:scenarios
          git diff --exit-code -- ../docs/analysis/simulation-baseline.json

      - name: Report simulation semantic diff
        run: npm run simulate:diff
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: Node dependency audit
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t adaptive-training-garmin-sync .
