name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest

  frontend-build:
    name: Frontend Build & Firestore Rules
    runs-on: ubuntu-latest
    env:
      # Build/test-only configuration. Production configuration remains deployment-owned.
      VITE_FIREBASE_API_KEY: AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY
      VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: example-project
      VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Validate workout library
        run: npm run validate:workouts

      - name: Run frontend test suite
        run: npm test

      - name: Run Firestore security-rule emulator suite
        run: npm run test:rules

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t adaptive-training-garmin-sync .
