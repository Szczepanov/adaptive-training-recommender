name: Temporary PR475 rules patch

on:
  push:
    branches: [codex/issue-430-schedule-window-boundary]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-430-schedule-window-boundary
      - name: Patch rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/firestore.rules')
          text = path.read_text()
          marker = 'function scheduleWindowManifestEntryTransitionIsValid'
          if marker in text:
              raise SystemExit(0)

          anchor = '    function hasValidScheduleWindowManifest(userId, date) {\n'
          helpers = '''    // Preserve per-window identity/revision semantics inside the date manifest.
              // Same-size edits keep stable ids/createdAt and advance changed entries exactly
              // once. Add/remove transitions retain every existing/surviving map verbatim;
              // this also supports cross-date moves whose target entry carries an advanced rev.
              function scheduleWindowManifestEntryTransitionIsValid(previousWindow, nextWindow) {
                return nextWindow == previousWindow || (
                  nextWindow.id == previousWindow.id
                  && nextWindow.createdAt == previousWindow.createdAt
                  && nextWindow.revision == previousWindow.revision + 1
                );
              }

              function hasValidSameSizeScheduleWindowManifestUpdate(previousWindows, nextWindows) {
                return previousWindows.size() == nextWindows.size()
                  && (nextWindows.size() < 1 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[0], nextWindows[0]))
                  && (nextWindows.size() < 2 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[1], nextWindows[1]))
                  && (nextWindows.size() < 3 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[2], nextWindows[2]))
                  && (nextWindows.size() < 4 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[3], nextWindows[3]))
                  && (nextWindows.size() < 5 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[4], nextWindows[4]))
                  && (nextWindows.size() < 6 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[5], nextWindows[5]))
                  && (nextWindows.size() < 7 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[6], nextWindows[6]))
                  && (nextWindows.size() < 8 || scheduleWindowManifestEntryTransitionIsValid(previousWindows[7], nextWindows[7]));
              }

              function hasValidScheduleWindowManifestTransition(previousWindows, nextWindows) {
                return hasValidSameSizeScheduleWindowManifestUpdate(previousWindows, nextWindows)
                  || (nextWindows.size() == previousWindows.size() + 1 && nextWindows.hasAll(previousWindows))
                  || (nextWindows.size() + 1 == previousWindows.size() && previousWindows.hasAll(nextWindows));
              }

          '''
          if anchor not in text:
              raise SystemExit('schedule manifest function anchor missing')
          text = text.replace(anchor, helpers + anchor, 1)

          old = '''      allow update: if hasValidScheduleWindowManifest(userId, date)
                  && request.resource.data.createdAt == resource.data.createdAt
                  && request.resource.data.revision == resource.data.revision + 1;
          '''
          new = '''      allow update: if hasValidScheduleWindowManifest(userId, date)
                  && request.resource.data.createdAt == resource.data.createdAt
                  && request.resource.data.revision == resource.data.revision + 1
                  && hasValidScheduleWindowManifestTransition(resource.data.windows, request.resource.data.windows);
          '''
          if old not in text:
              raise SystemExit('schedule manifest update anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit rules patch when needed
        shell: bash
        run: |
          if git diff --quiet -- app/firestore.rules; then
            echo "Rules already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/firestore.rules
          git commit -m "fix(schedule): preserve manifest window identity revisions"
          git push origin HEAD:codex/issue-430-schedule-window-boundary
