name: Garmin Token Bootstrap

# One-time (and occasional refresh) Garmin authentication for one Firebase user.
#
# Multi-user credentials are isolated with GitHub Environments. Create one environment per
# Garmin account (for example `garmin-primary` and `garmin-wife`) and put GARMIN_EMAIL,
# GARMIN_PASSWORD and optionally GARMIN_TOTP_SECRET in that environment. The resulting OAuth
# token is uploaded to garmin/users/<firebase-uid>/garmin_tokens.json. Scheduled Cloud Run
# jobs never receive Garmin passwords.
on:
  workflow_dispatch:
    inputs:
      app_user_id:
        description: "Firebase Authentication UID that owns this Garmin account"
        required: true
        type: string
      garmin_environment:
        description: "GitHub Environment containing this user's Garmin credentials"
        required: true
        type: environment
      mfa_code:
        description: "Fallback Garmin MFA code when this environment has no GARMIN_TOTP_SECRET"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Bootstrap Garmin token
    runs-on: ubuntu-latest
    environment: ${{ inputs.garmin_environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Garmin login and upload user-scoped token to GCS
        env:
          APP_USER_ID: ${{ inputs.app_user_id }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_ALLOW_CREDENTIAL_LOGIN: "true"
          GARMIN_TOTP_SECRET: ${{ secrets.GARMIN_TOTP_SECRET }}
          GARMIN_MFA_CODE: ${{ inputs.mfa_code }}
        run: |
          if [ -z "${GARMIN_EMAIL}" ] || [ -z "${GARMIN_PASSWORD}" ]; then
            echo "Selected GitHub Environment must define GARMIN_EMAIL and GARMIN_PASSWORD" >&2
            exit 1
          fi
          uv run python scripts/bootstrap_garmin_tokens.py \
            --bucket "${{ secrets.GCP_PROJECT_ID }}-garmin-tokens" \
            --object "garmin/users/${APP_USER_ID}/garmin_tokens.json"
