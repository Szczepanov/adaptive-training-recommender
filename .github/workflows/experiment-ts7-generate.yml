name: Experimental TS7 lock generation

on:
  push:
    branches:
      - experiment/typescript7-eslint10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Resolve experimental dependency graph
        working-directory: app
        run: npm install

      - name: Apply ESLint 10 no-useless-assignment cleanups
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/src/engine/rules.ts'): [
                  ("    let rationale = '';\n", "    let rationale: string;\n"),
                  ("    let modalityNote: string | null = null;\n", "    let modalityNote: string | null;\n"),
              ],
              Path('app/src/engine/stimulus.ts'): [
                  ("    let rawStimulusContribution = 0;\n", "    let rawStimulusContribution: number;\n"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected exactly one match in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify TypeScript 7 compiler
        working-directory: app
        run: |
          echo "tsc: $(./node_modules/.bin/tsc --version)"
          echo "tsc6: $(./node_modules/.bin/tsc6 --version)"
          npm run typecheck

      - name: Verify ESLint 10 with TypeScript 6 API compatibility package
        working-directory: app
        run: npm run lint

      - name: Run frontend tests
        working-directory: app
        run: npm test

      - name: Validate workout library
        working-directory: app
        run: npm run validate:workouts

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts7-eslint10-generated
          path: |
            app/package-lock.json
            app/src/engine/rules.ts
            app/src/engine/stimulus.ts
