version: 2
updates:
  # Python (root pyproject.toml, managed with uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # Frontend app
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # TypeScript 7.0 has no programmatic compiler API. typescript-eslint currently
    # requires the TypeScript 6 API, so defer 7.0.x until the lint toolchain supports it.
    ignore:
      - dependency-name: "typescript"
        versions:
          - "7.0.x"
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Container base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
