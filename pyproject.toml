[project]
name = "adaptive-training-recommender"
version = "0.1.0"
description = "Garmin data fetcher for adaptive training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "firebase-admin",
    "garminconnect",
    "python-dotenv",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
