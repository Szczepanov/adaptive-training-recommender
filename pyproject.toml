[project]
name = "adaptive-training-recommender"
version = "0.1.0"
description = "Garmin data fetcher for adaptive training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "firebase-admin",
    "garminconnect>=0.3.8,<0.4",
    "google-cloud-storage",
    "pyotp>=2.9,<3",
    "python-dotenv",
    "tzdata",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=7.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_sync"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    "scripts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src/garmin_sync"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
